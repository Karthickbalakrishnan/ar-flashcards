<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>OrganoAR — Spatial Health Experience</title>

  <!-- Core 3D & Tracking Engines -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-three.prod.js"></script>

  <style>
    :root {
      --sys-surface: rgba(15, 23, 42, 0.85);
      --sys-border: rgba(255, 255, 255, 0.1);
      --sys-primary: #38bdf8;
      --sys-danger: #fb7185;
      --sys-text: #f8fafc;
      --sys-subtext: #94a3b8;
      --radius-sheet: 28px;
      --radius-pill: 9999px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #020617;
      color: var(--sys-text);
    }

    #arContainer {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* Onboarding Permission Screen */
    #welcomeGate {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: radial-gradient(circle at 50% 30%, #1e293b, #020617);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .welcome-card {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--sys-border);
      border-radius: 32px;
      padding: 40px 32px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 32px 64px -16px rgba(0, 0, 0, 0.6);
    }

    .app-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.1);
      padding: 6px 16px;
      border-radius: var(--radius-pill);
      color: var(--sys-primary);
      font-size: 0.8125rem;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .welcome-title { font-size: 1.625rem; font-weight: 700; margin: 0 0 10px 0; letter-spacing: -0.02em; }
    .welcome-desc { font-size: 0.9375rem; color: var(--sys-subtext); margin: 0 0 32px 0; line-height: 1.5; }

    .sso-stack { display: flex; flex-direction: column; gap: 12px; }

    .btn-sso {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--sys-border);
      border-radius: 16px;
      color: var(--sys-text);
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn-sso:active { transform: scale(0.98); background: rgba(255, 255, 255, 0.15); }

    /* Top Guidance Pill */
    #guideBanner {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--sys-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--sys-border);
      padding: 10px 22px;
      border-radius: var(--radius-pill);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--sys-text);
      z-index: 100;
      display: none;
      box-shadow: 0 12px 24px -6px rgba(0, 0, 0, 0.3);
    }

    /* Bottom Control Sheet */
    .sheet-overlay {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      width: calc(100% - 32px);
      max-width: 420px;
      display: none;
    }

    .sheet-card {
      background: var(--sys-surface);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--sys-border);
      border-radius: var(--radius-sheet);
      padding: 20px;
      box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sheet-header { display: flex; justify-content: space-between; align-items: center; }
    .organ-heading { font-size: 1.0625rem; font-weight: 700; color: var(--sys-text); }

    .health-pill {
      font-size: 0.78125rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      background: rgba(56, 189, 248, 0.12);
      color: var(--sys-primary);
    }

    .health-pill.is-critical { background: rgba(251, 113, 133, 0.15); color: var(--sys-danger); }

    .lifestyle-grid { display: flex; gap: 8px; }

    .lifestyle-chip {
      flex: 1;
      padding: 10px 6px;
      border: 1px solid var(--sys-border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--sys-subtext);
      font-size: 0.8125rem;
      font-weight: 500;
      border-radius: 14px;
      cursor: pointer;
      text-align: center;
    }

    .lifestyle-chip.is-active {
      background: rgba(251, 113, 133, 0.15);
      border-color: var(--sys-danger);
      color: var(--sys-text);
      font-weight: 600;
    }

    .slider-container { display: flex; flex-direction: column; gap: 8px; }
    .slider-labels { display: flex; justify-content: space-between; font-size: 0.8125rem; color: var(--sys-subtext); font-weight: 500; }

    input[type=range] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.12);
      accent-color: var(--sys-primary);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- SSO Authentication Gate -->
  <div id="welcomeGate">
    <div class="welcome-card">
      <div class="app-badge">OrganoAR Spatial Health</div>
      <h1 class="welcome-title">Explore Human Anatomy</h1>
      <p class="welcome-desc">Sign in to authorize camera access and launch real-time flashcard recognition.</p>

      <div class="sso-stack">
        <button class="btn-sso" onclick="initNativeAR('Google')">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Continue with Google
        </button>

        <button class="btn-sso" onclick="initNativeAR('Microsoft')">
          <svg width="18" height="18" viewBox="0 0 23 23"><path fill="#f35325" d="M1 1h10v10H1z"/><path fill="#81bc06" d="M12 1h10v10H12z"/><path fill="#05a6f0" d="M1 12h10v10H1z"/><path fill="#ffba08" d="M12 12h10v10H12z"/></svg>
          Continue with Microsoft
        </button>
      </div>
    </div>
  </div>

  <div id="guideBanner">Point camera at an organ card</div>

  <main class="sheet-overlay" id="sheetControls">
    <section class="sheet-card">
      <div class="sheet-header">
        <span class="organ-heading" id="organHeading">Organ View</span>
        <span class="health-pill" id="healthPill">Health Score 100%</span>
      </div>

      <div class="lifestyle-grid" id="lifestyleGrid">
        <button class="lifestyle-chip" data-factor="alcohol">🍺 Alcohol</button>
        <button class="lifestyle-chip" data-factor="tobacco">🚬 Tobacco</button>
        <button class="lifestyle-chip" data-factor="substance">💊 Opioids</button>
      </div>

      <div class="slider-container">
        <div class="slider-labels">
          <span>Simulate Exposure</span>
          <span id="durationLabel">1 Year</span>
        </div>
        <input type="range" id="exposureSlider" min="1" max="20" value="1">
      </div>
    </section>
  </main>

  <!-- AR Container -->
  <div id="arContainer"></div>

  <script>
    const AppState = {
      activeOrgan: "Liver",
      years: 1,
      factors: { alcohol: false, tobacco: false, substance: false }
    };

    const OrganConfig = [
      { name: "Liver", model: "./assets/models/liver.glb" },
      { name: "Heart", model: "./assets/models/heart.glb" },
      { name: "Lungs", model: "./assets/models/lung.glb" },
      { name: "Kidneys", model: "./assets/models/kidney.glb" },
      { name: "Stomach", model: "./assets/models/stomach.glb" }
    ];

    let mindThree, loadedModels = {};

    async function initNativeAR(provider) {
      document.getElementById("welcomeGate").style.display = "none";
      document.getElementById("guideBanner").style.display = "block";

      try {
        // Initialize MindAR with pure Three.js (No A-Frame)
        mindThree = new window.MINDAR.IMAGE.MindARThree({
          container: document.getElementById("arContainer"),
          imageTargetSrc: "./assets/targets/organs.mind",
          uiScanning: "no",
          uiLoading: "no"
        });

        const { renderer, scene, camera } = mindThree;

        // Ambient & Studio Lights
        const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.5);
        scene.add(light);

        const gltfLoader = new THREE.GLTFLoader();

        // Create anchors for all 5 target indices
        OrganConfig.forEach((config, idx) => {
          const anchor = mindThree.addAnchor(idx);

          // Lazy load GLTF model when target is detected
          anchor.onTargetFound = () => {
            AppState.activeOrgan = config.name;
            document.getElementById("guideBanner").innerText = `Viewing ${config.name}`;
            document.getElementById("sheetControls").style.display = "block";

            if (!loadedModels[config.name]) {
              gltfLoader.load(config.model, (gltf) => {
                const model = gltf.scene;
                model.scale.set(0.5, 0.5, 0.5);
                anchor.group.add(model);
                loadedModels[config.name] = model;
                updateMaterials();
              });
            } else {
              updateMaterials();
            }
          };

          anchor.onTargetLost = () => {
            document.getElementById("guideBanner").innerText = "Point camera at an organ card";
            document.getElementById("sheetControls").style.display = "none";
          };
        });

        // Touch gesture tracking for rotation & pinch scale
        let lastTouchX = 0, lastTouchY = 0, initialPinchDistance = null;

        window.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) {
            lastTouchX = e.touches[0].clientX;
            lastTouchY = e.touches[0].clientY;
          } else if (e.touches.length === 2) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            initialPinchDistance = Math.sqrt(dx * dx + dy * dy);
          }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
          const activeModel = loadedModels[AppState.activeOrgan];
          if (!activeModel) return;

          if (e.touches.length === 1) {
            const deltaX = e.touches[0].clientX - lastTouchX;
            const deltaY = e.touches[0].clientY - lastTouchY;

            activeModel.rotation.y += deltaX * 0.01;
            activeModel.rotation.x += deltaY * 0.01;

            lastTouchX = e.touches[0].clientX;
            lastTouchY = e.touches[0].clientY;
          } else if (e.touches.length === 2 && initialPinchDistance) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const factor = dist / initialPinchDistance;

            let newScale = activeModel.scale.x * factor;
            newScale = Math.min(Math.max(newScale, 0.2), 1.5);
            activeModel.scale.set(newScale, newScale, newScale);

            initialPinchDistance = dist;
          }
        }, { passive: true });

        // Start WebRTC camera and WebGL loop
        await mindThree.start();
        renderer.setAnimationLoop(() => {
          renderer.render(scene, camera);
        });

      } catch (err) {
        alert("Camera permission denied or unsupported browser. Please open in native Chrome or Safari over HTTPS.");
      }
    }

    function updateMaterials() {
      const activeModel = loadedModels[AppState.activeOrgan];
      if (!activeModel) return;

      let activeFactorCount = Object.values(AppState.factors).filter(Boolean).length;
      let healthScore = Math.max(15, 100 - (AppState.years * activeFactorCount * 2.2));

      document.getElementById("organHeading").innerText = `${AppState.activeOrgan} Health View`;
      document.getElementById("durationLabel").innerText = `${AppState.years} Year${AppState.years > 1 ? 's' : ''}`;
      
      const healthPill = document.getElementById("healthPill");
      healthPill.innerText = `Health Score ${Math.round(healthScore)}%`;
      if (healthScore < 65) healthPill.classList.add("is-critical");
      else healthPill.classList.remove("is-critical");

      const yearRatio = AppState.years / 20.0;

      activeModel.traverse((node) => {
        if (node.isMesh && node.material) {
          let color = new THREE.Color(0xffffff);
          let roughness = 0.4;

          if (activeFactorCount > 0) {
            if (AppState.factors.alcohol && !AppState.factors.tobacco && !AppState.factors.substance) {
              color.lerp(new THREE.Color(0xd97706), yearRatio * 0.85);
              roughness = 0.2;
            } else if (AppState.factors.tobacco && !AppState.factors.alcohol && !AppState.factors.substance) {
              color.lerp(new THREE.Color(0x1e293b), yearRatio * 0.90);
              roughness = 0.85;
            } else if (AppState.factors.substance && !AppState.factors.alcohol && !AppState.factors.tobacco) {
              color.lerp(new THREE.Color(0x581c87), yearRatio * 0.88);
              roughness = 0.6;
            } else {
              color.lerp(new THREE.Color(0x270707), yearRatio * 0.95);
              roughness = 0.95;
            }
            color.multiplyScalar(1.0 - (yearRatio * 0.45));
          }

          node.material.color = color;
          node.material.roughness = roughness;
          node.material.needsUpdate = true;
        }
      });
    }

    document.getElementById("lifestyleGrid").addEventListener("click", (e) => {
      const chip = e.target.closest(".lifestyle-chip");
      if (!chip) return;

      const factor = chip.dataset.factor;
      AppState.factors[factor] = !AppState.factors[factor];
      chip.classList.toggle("is-active", AppState.factors[factor]);
      updateMaterials();
    });

    document.getElementById("exposureSlider").addEventListener("input", (e) => {
      AppState.years = parseInt(e.target.value, 10);
      updateMaterials();
    });
  </script>
</body>
</html>
