<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hepatic Physiology & Pathology AR</title>

  <!-- A-Frame and MindAR Libraries -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-left-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #info-card {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 88%;
      max-width: 420px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #ffffff;
      padding: 16px 20px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      z-index: 1000;
      display: none;
      text-align: center;
    }

    #info-card h3 { margin: 0 0 6px 0; font-size: 1.1rem; color: #38bdf8; }
    #info-card p { margin: 0; font-size: 0.88rem; color: #cbd5e1; line-height: 1.35; }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div class="spinner"></div>
    <div>Loading Hepatic Physiology AR...</div>
  </div>

  <div id="info-card">
    <h3 id="card-title">Liver Anatomy</h3>
    <p id="card-desc">Scan a flashcard to inspect structures.</p>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <a-asset-item id="liverModel" src="./liver.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- TARGET 0: 1.png (Anterior View) -->
    <a-entity mindar-image-target="targetIndex: 0" id="target-0">
      <a-gltf-model src="#liverModel" position="0 0 0.1" scale="0.04 0.04 0.04" rotation="0 0 0"></a-gltf-model>
    </a-entity>

    <!-- TARGET 1: 2.png (Posterior View) -->
    <a-entity mindar-image-target="targetIndex: 1" id="target-1">
      <a-gltf-model src="#liverModel" position="0 0 0.1" scale="0.04 0.04 0.04" rotation="0 180 0"></a-gltf-model>
    </a-entity>

    <!-- TARGET 2: 3.png (Inferior View) -->
    <a-entity mindar-image-target="targetIndex: 2" id="target-2">
      <a-gltf-model src="#liverModel" position="0 0 0.1" scale="0.04 0.04 0.04" rotation="90 0 0"></a-gltf-model>
    </a-entity>

    <!-- TARGET 3: 4.png (Superior View) -->
    <a-entity mindar-image-target="targetIndex: 3" id="target-3">
      <a-gltf-model src="#liverModel" position="0 0 0.1" scale="0.04 0.04 0.04" rotation="-90 0 0"></a-gltf-model>
    </a-entity>

    <!-- TARGET 4: 5.png (Lateral View) -->
    <a-entity mindar-image-target="targetIndex: 4" id="target-4">
      <a-gltf-model src="#liverModel" position="0 0 0.1" scale="0.04 0.04 0.04" rotation="0 -90 0"></a-gltf-model>
    </a-entity>

    <!-- TARGET 5: 6.png (Inferior Alt) -->
    <a-entity mindar-image-target="targetIndex: 5" id="target-5">
      <a-gltf-model src="#liverModel" position="0 0 0.1" scale="0.04 0.04 0.04" rotation="90 45 0"></a-gltf-model>
    </a-entity>

    <!-- TARGET 6: 7.png (Superior Alt) -->
    <a-entity mindar-image-target="targetIndex: 6" id="target-6">
      <a-gltf-model src="#liverModel" position="0 0 0.1" scale="0.04 0.04 0.04" rotation="-90 45 0"></a-gltf-model>
    </a-entity>

    <!-- TARGET 7: 8.png (Lateral Alt) -->
    <a-entity mindar-image-target="targetIndex: 7" id="target-7">
      <a-gltf-model src="#liverModel" position="0 0 0.1" scale="0.04 0.04 0.04" rotation="0 90 0"></a-gltf-model>
    </a-entity>

    <!-- TARGET 8: 9.png (Hepatic Segments) -->
    <a-entity mindar-image-target="targetIndex: 8" id="target-8">
      <a-gltf-model src="#liverModel" position="0 0 0.1" scale="0.04 0.04 0.04" rotation="0 45 0"></a-gltf-model>
    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const sceneEl = document.querySelector("a-scene");
      const loadingScreen = document.getElementById("loading-screen");
      const infoCard = document.getElementById("info-card");
      const cardTitle = document.getElementById("card-title");
      const cardDesc = document.getElementById("card-desc");

      sceneEl.addEventListener("loaded", () => {
        loadingScreen.style.opacity = "0";
        setTimeout(() => { loadingScreen.style.display = "none"; }, 400);
      });

      const cardDetails = {
        "target-0": { title: "Card 1: Anterior View", desc: "Showcases the right and left lobes, falciform ligament, and gallbladder." },
        "target-1": { title: "Card 2: Posterior View", desc: "Exposes the portal triad (portal vein, hepatic artery, bile duct) and IVC." },
        "target-2": { title: "Card 3: Inferior View", desc: "Visceral surface displaying organ impressions and porta hepatis." },
        "target-3": { title: "Card 4: Superior View", desc: "Diaphragmatic surface showing bare area and coronary ligaments." },
        "target-4": { title: "Card 5: Lateral View", desc: "Convex lateral profile resting against lower costal margin." },
        "target-5": { title: "Card 6: Visceral Anatomy", desc: "Detailed inferior aspect mapping gallbladder bed and caudate lobe." },
        "target-6": { title: "Card 7: Diaphragmatic Surface", desc: "Superior convex interface fitting beneath the thoracic diaphragm." },
        "target-7": { title: "Card 8: Costal Profile", desc: "Lateral right lobe view showing intercostal relationship." },
        "target-8": { title: "Card 9: Hepatic Segments", desc: "Vascular tree mapping 8 Couinaud functional segments." }
      };

      const targets = document.querySelectorAll("[mindar-image-target]");
      targets.forEach((target) => {
        target.addEventListener("targetFound", (event) => {
          const details = cardDetails[event.target.id] || { title: "Target Found", desc: "Hepatic structure detected." };
          cardTitle.innerText = details.title;
          cardDesc.innerText = details.desc;
          infoCard.style.display = "block";
        });

        target.addEventListener("targetLost", () => {
          infoCard.style.display = "none";
        });
      });
    });
  </script>

</body>
</html>
