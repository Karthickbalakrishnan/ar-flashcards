<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hepatic AR Diagnostic</title>

  <!-- Essential WebAR Libraries -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-left-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #info-card {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      max-width: 400px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid #38bdf8;
      color: #ffffff;
      padding: 14px;
      border-radius: 12px;
      z-index: 1000;
      display: none;
      text-align: center;
    }

    #info-card h3 { margin: 0 0 4px 0; font-size: 1rem; color: #38bdf8; }
    #info-card p { margin: 0; font-size: 0.85rem; color: #cbd5e1; }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div class="spinner"></div>
    <div id="loading-text">Starting Camera & AR Engine...</div>
  </div>

  <div id="info-card">
    <h3 id="card-title">Target Detected</h3>
    <p id="card-desc">Anatomy card recognized.</p>
  </div>

  <a-scene 
    id="ar-scene"
    mindar-image="imageTargetSrc: ./livertargets.mind; autoStart: true; uiLoading: no; uiError: no;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Fallback Box + Light for Immediate Visual Confirmation -->
    <a-light type="ambient" intensity="1.5"></a-light>
    <a-light type="directional" position="1 2 3" intensity="2.0"></a-light>

    <!-- TARGET 0: Anterior View -->
    <a-entity mindar-image-target="targetIndex: 0" id="target-0">
      <a-box position="0 0 0.1" scale="0.3 0.3 0.3" color="#38bdf8"></a-box>
    </a-entity>

    <!-- TARGET 1: Posterior View -->
    <a-entity mindar-image-target="targetIndex: 1" id="target-1">
      <a-box position="0 0 0.1" scale="0.3 0.3 0.3" color="#10b981"></a-box>
    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const sceneEl = document.querySelector("#ar-scene");
      const loadingScreen = document.getElementById("loading-screen");
      const loadingText = document.getElementById("loading-text");
      const infoCard = document.getElementById("info-card");
      const cardTitle = document.getElementById("card-title");
      const cardDesc = document.getElementById("card-desc");

      // Force loading screen dismissal on AR engine initialization
      sceneEl.addEventListener("arReady", () => {
        loadingScreen.style.opacity = "0";
        setTimeout(() => { loadingScreen.style.display = "none"; }, 300);
      });

      sceneEl.addEventListener("arError", (err) => {
        loadingText.innerText = "Camera permission or WebGL error. Please refresh.";
      });

      const cardDetails = {
        "target-0": { title: "Anterior View Detected", desc: "Showing test cyan cube over falciform ligament." },
        "target-1": { title: "Posterior View Detected", desc: "Showing test green cube over portal triad." }
      };

      const targets = document.querySelectorAll("[mindar-image-target]");
      targets.forEach((target) => {
        target.addEventListener("targetFound", (event) => {
          const details = cardDetails[event.target.id] || { title: "Target Active", desc: "Card tracked successfully." };
          cardTitle.innerText = details.title;
          cardDesc.innerText = details.desc;
          infoCard.style.display = "block";
        });

        target.addEventListener("targetLost", () => {
          infoCard.style.display = "none";
        });
      });
    });
  </script>

</body>
</html>
