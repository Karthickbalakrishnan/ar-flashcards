<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OrganoAR — Multiorgan Substance Impact & Recovery Simulator</title>

  <!-- Stable A-Frame & MindAR Libraries -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <!-- Touch Gesture Component -->
  <script>
    AFRAME.registerComponent('gesture-controls', {
      schema: {
        rotationFactor: { type: 'number', default: 5 },
        zoomStep: { type: 'number', default: 0.5 },
        minScale: { type: 'number', default: 0.5 },
        maxScale: { type: 'number', default: 10.0 }
      },
      init: function () {
        this.handleTouchStart = this.handleTouchStart.bind(this);
        this.handleTouchMove = this.handleTouchMove.bind(this);
        
        this.touchX = 0;
        this.touchY = 0;

        window.addEventListener('touchstart', this.handleTouchStart, { passive: false });
        window.addEventListener('touchmove', this.handleTouchMove, { passive: false });
      },
      handleTouchStart: function (evt) {
        if (evt.touches.length === 1) {
          this.touchX = evt.touches[0].clientX;
          this.touchY = evt.touches[0].clientY;
        }
      },
      handleTouchMove: function (evt) {
        if (evt.touches.length === 1) {
          const deltaX = evt.touches[0].clientX - this.touchX;
          const deltaY = evt.touches[0].clientY - this.touchY;
          const currentRotation = this.el.getAttribute('rotation');

          this.el.setAttribute('rotation', {
            x: currentRotation.x + deltaY * (this.data.rotationFactor * 0.1),
            y: currentRotation.y + deltaX * (this.data.rotationFactor * 0.1),
            z: currentRotation.z
          });

          this.touchX = evt.touches[0].clientX;
          this.touchY = evt.touches[0].clientY;
        }
      },
      zoomIn: function () {
        const currentScale = this.el.getAttribute('scale');
        let newScale = Math.min(currentScale.x + this.data.zoomStep, this.data.maxScale);
        this.el.setAttribute('scale', { x: newScale, y: newScale, z: newScale });
      },
      zoomOut: function () {
        const currentScale = this.el.getAttribute('scale');
        let newScale = Math.max(currentScale.x - this.data.zoomStep, this.data.minScale);
        this.el.setAttribute('scale', { x: newScale, y: newScale, z: newScale });
      },
      remove: function () {
        window.removeEventListener('touchstart', this.handleTouchStart);
        window.removeEventListener('touchmove', this.handleTouchMove);
      }
    });
  </script>

  <style>
    :root {
      --bg-glass: rgba(15, 23, 42, 0.78);
      --border-glass: rgba(255, 255, 255, 0.12);
      --accent-cyan: #38bdf8;
      --accent-rose: #f43f5e;
      --accent-emerald: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      touch-action: none;
      background: #020617;
      color: var(--text-main);
    }

    /* Loading Screen */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #020617;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .pulse-ring {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.1);
      border: 2px solid var(--accent-cyan);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      animation: pulse 1.6s ease-in-out infinite;
      margin-bottom: 20px;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    #loading-msg {
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 500;
    }

    /* Top Organ Navigation Bar */
    #top-nav {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      background: var(--bg-glass);
      backdrop-filter: blur(16px) saturate(180%);
      padding: 5px;
      border-radius: 24px;
      border: 1px solid var(--border-glass);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      z-index: 2000;
    }

    .nav-tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 14px;
      border-radius: 18px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .nav-tab.active {
      background: var(--accent-cyan);
      color: #020617;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    /* Duration & Mode Timeline Control */
    #timeline-card {
      position: fixed;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      width: 88%;
      max-width: 380px;
      background: var(--bg-glass);
      backdrop-filter: blur(16px) saturate(180%);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 10px 16px;
      z-index: 2000;
    }

    .timeline-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .timeline-header span:last-child {
      color: var(--accent-cyan);
      font-weight: 700;
    }

    input[type=range] {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      accent-color: var(--accent-cyan);
      cursor: pointer;
    }

    /* Floating Action Buttons */
    #right-actions {
      position: fixed;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 2000;
    }

    .fab {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .fab.active {
      background: var(--accent-rose);
      border-color: rgba(244, 63, 94, 0.4);
      box-shadow: 0 0 16px rgba(244, 63, 94, 0.4);
    }

    /* Bottom Information Dashboard */
    #dashboard-card {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 420px;
      background: var(--bg-glass);
      backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--border-glass);
      padding: 18px 20px;
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      z-index: 1000;
      display: none;
    }

    #card-title {
      margin: 0 0 4px 0;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent-cyan);
      letter-spacing: -0.01em;
    }

    #card-desc {
      margin: 0 0 12px 0;
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--border-glass);
    }

    .metric-pill {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-glass);
      padding: 6px 10px;
      border-radius: 10px;
      text-align: center;
    }

    .metric-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.05em;
      display: block;
      margin-bottom: 2px;
    }

    .metric-value {
      font-size: 0.88rem;
      font-weight: 700;
    }

    .status-good { color: var(--accent-emerald); }
    .status-warn { color: #f59e0b; }
    .status-crit { color: var(--accent-rose); }

    /* Help & De-addiction Hotline Button */
    #help-btn {
      position: fixed;
      left: 16px;
      top: 16px;
      padding: 8px 12px;
      border-radius: 20px;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      color: var(--accent-cyan);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      z-index: 2000;
    }
  </style>
</head>
<body>

  <!-- Loading State -->
  <div id="loading-screen">
    <div class="pulse-ring"></div>
    <div id="loading-msg">Initializing OrganoAR Engine...</div>
  </div>

  <!-- De-Addiction Support Hotline -->
  <button id="help-btn" onclick="alert('National De-Addiction Toll-Free Helpline (India): 14446\nConfidential Support Available 24/7.')">🆘 Helpline</button>

  <!-- Top Organ Selector -->
  <div id="top-nav">
    <button class="nav-tab active" data-organ="liver">Liver</button>
    <button class="nav-tab" data-organ="brain">Brain Pathway</button>
    <button class="nav-tab" data-organ="lungs">Lungs</button>
  </div>

  <!-- Exposure Timeline Slider -->
  <div id="timeline-card">
    <div class="timeline-header">
      <span>Substance Exposure Timeline</span>
      <span id="years-val">1 Year</span>
    </div>
    <input type="range" id="years-slider" min="1" max="20" value="1" step="1">
  </div>

  <!-- Floating Action Buttons -->
  <div id="right-actions">
    <button class="fab" id="btn-alcohol" title="Toggle Alcohol Impact">🍺</button>
    <button class="fab" id="btn-smoking" title="Toggle Tobacco Impact">🚬</button>
    <button class="fab" id="btn-opioid" title="Toggle Opioid Impact">💊</button>
    <div style="height: 1px; background: var(--border-glass); margin: 2px 0;"></div>
    <button class="fab" id="btn-zoom-in">+</button>
    <button class="fab" id="btn-zoom-out">−</button>
  </div>

  <!-- Bottom Analytics Dashboard -->
  <div id="dashboard-card">
    <h3 id="card-title">Anterior View</h3>
    <p id="card-desc">Scan a flashcard to inspect structures.</p>
    <div class="metrics-grid">
      <div class="metric-pill">
        <span class="metric-label">Organ Efficiency</span>
        <span id="health-val" class="metric-value status-good">100%</span>
      </div>
      <div class="metric-pill">
        <span class="metric-label">Pathology Index</span>
        <span id="status-val" class="metric-value status-good">Normal</span>
      </div>
    </div>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./livertargets.mind; autoStart: true;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <a-asset-item id="liverModel" src="./liver.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Professional Studio Lighting -->
    <a-light id="ambient-light" type="ambient" intensity="1.8"></a-light>
    <a-light id="dir-light" type="directional" position="1 2 3" intensity="2.5"></a-light>

    <!-- TARGET 0: Anterior View -->
    <a-entity mindar-image-target="targetIndex: 0" id="target-0">
      <a-gltf-model class="target-model" src="#liverModel" position="0 0 0.2" scale="2.5 2.5 2.5" rotation="0 0 0" gesture-controls></a-gltf-model>
    </a-entity>

    <!-- TARGET 1: Posterior View -->
    <a-entity mindar-image-target="targetIndex: 1" id="target-1">
      <a-gltf-model class="target-model" src="#liverModel" position="0 0 0.2" scale="2.5 2.5 2.5" rotation="0 180 0" gesture-controls></a-gltf-model>
    </a-entity>

    <!-- TARGET 2: Inferior View -->
    <a-entity mindar-image-target="targetIndex: 2" id="target-2">
      <a-gltf-model class="target-model" src="#liverModel" position="0 0 0.2" scale="2.5 2.5 2.5" rotation="90 0 0" gesture-controls></a-gltf-model>
    </a-entity>

    <!-- TARGET 3: Superior View -->
    <a-entity mindar-image-target="targetIndex: 3" id="target-3">
      <a-gltf-model class="target-model" src="#liverModel" position="0 0 0.2" scale="2.5 2.5 2.5" rotation="-90 0 0" gesture-controls></a-gltf-model>
    </a-entity>

    <!-- TARGET 4: Lateral View -->
    <a-entity mindar-image-target="targetIndex: 4" id="target-4">
      <a-gltf-model class="target-model" src="#liverModel" position="0 0 0.2" scale="2.5 2.5 2.5" rotation="0 -90 0" gesture-controls></a-gltf-model>
    </a-entity>

    <!-- TARGET 5: Visceral Anatomy -->
    <a-entity mindar-image-target="targetIndex: 5" id="target-5">
      <a-gltf-model class="target-model" src="#liverModel" position="0 0 0.2" scale="2.5 2.5 2.5" rotation="90 45 0" gesture-controls></a-gltf-model>
    </a-entity>

    <!-- TARGET 6: Diaphragmatic Surface -->
    <a-entity mindar-image-target="targetIndex: 6" id="target-6">
      <a-gltf-model class="target-model" src="#liverModel" position="0 0 0.2" scale="2.5 2.5 2.5" rotation="-90 45 0" gesture-controls></a-gltf-model>
    </a-entity>

    <!-- TARGET 7: Costal Profile -->
    <a-entity mindar-image-target="targetIndex: 7" id="target-7">
      <a-gltf-model class="target-model" src="#liverModel" position="0 0 0.2" scale="2.5 2.5 2.5" rotation="0 90 0" gesture-controls></a-gltf-model>
    </a-entity>

    <!-- TARGET 8: Hepatic Segments -->
    <a-entity mindar-image-target="targetIndex: 8" id="target-8">
      <a-gltf-model class="target-model" src="#liverModel" position="0 0 0.2" scale="2.5 2.5 2.5" rotation="0 45 0" gesture-controls></a-gltf-model>
    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const sceneEl = document.querySelector("a-scene");
      const loadingScreen = document.getElementById("loading-screen");
      const dashboardCard = document.getElementById("dashboard-card");
      const cardTitle = document.getElementById("card-title");
      const cardDesc = document.getElementById("card-desc");
      const healthVal = document.getElementById("health-val");
      const statusVal = document.getElementById("status-val");
      const yearsSlider = document.getElementById("years-slider");
      const yearsVal = document.getElementById("years-val");

      let activeTarget = null;
      let activeOrgan = "liver";
      let alcoholActive = false;
      let smokingActive = false;
      let opioidActive = false;
      let yearsExposure = 1;

      const dismissLoading = () => {
        loadingScreen.style.opacity = "0";
        setTimeout(() => { loadingScreen.style.display = "none"; }, 500);
      };
      sceneEl.addEventListener("arReady", dismissLoading);
      setTimeout(dismissLoading, 4000);

      const cardDetails = {
        "target-0": { title: "Anterior View", desc: "Showcases the right and left lobes, falciform ligament, and gallbladder." },
        "target-1": { title: "Posterior View", desc: "Exposes the portal triad (portal vein, hepatic artery, bile duct) and IVC." },
        "target-2": { title: "Inferior View", desc: "Visceral surface displaying organ impressions and porta hepatis." },
        "target-3": { title: "Superior View", desc: "Diaphragmatic surface showing bare area and coronary ligaments." },
        "target-4": { title: "Lateral View", desc: "Convex lateral profile resting against lower costal margin." },
        "target-5": { title: "Visceral Anatomy", desc: "Detailed inferior aspect mapping gallbladder bed and caudate lobe." },
        "target-6": { title: "Diaphragmatic Surface", desc: "Superior convex interface fitting beneath the thoracic diaphragm." },
        "target-7": { title: "Costal Profile", desc: "Lateral right lobe view showing intercostal relationship." },
        "target-8": { title: "Hepatic Segments", desc: "Vascular tree mapping 8 Couinaud functional segments." }
      };

      const calculateHealth = () => {
        let health = 100;
        let factor = 0;
        if (alcoholActive) factor += 2.0;
        if (smokingActive) factor += 1.5;
        if (opioidActive) factor += 2.5;

        health -= Math.round(yearsExposure * factor);
        return Math.max(12, Math.min(100, health));
      };

      const applyPathologyToMesh = () => {
        const health = calculateHealth();
        const durationFactor = yearsExposure / 20.0;

        document.querySelectorAll(".target-model").forEach((modelEl) => {
          const mesh = modelEl.getObject3D('mesh');
          if (!mesh) return;

          mesh.traverse((node) => {
            if (node.isMesh && node.material) {
              let targetColor = new THREE.Color(0xffffff);
              let targetRoughness = 0.5;

              if (smokingActive || alcoholActive || opioidActive) {
                const darkness = 1.0 - (durationFactor * 0.6);
                targetColor.multiplyScalar(darkness);

                if (smokingActive) targetColor.lerp(new THREE.Color(0x334155), durationFactor * 0.5);
                if (alcoholActive) targetColor.lerp(new THREE.Color(0x7c2d12), durationFactor * 0.5);
                if (opioidActive) targetColor.lerp(new THREE.Color(0x4c1d95), durationFactor * 0.6);

                targetRoughness = Math.min(0.98, targetRoughness + (durationFactor * 0.4));
              }

              node.material.color = targetColor;
              node.material.roughness = targetRoughness;
              node.material.needsUpdate = true;
            }
          });
        });
      };

      const updateDashboard = () => {
        if (!activeTarget) return;

        let base = cardDetails[activeTarget] || { title: "Target Detected", desc: "Organ structure active." };
        cardTitle.innerText = `${base.title} [${activeOrgan.toUpperCase()}]`;

        const health = calculateHealth();
        healthVal.innerText = `${health}%`;

        if (health > 75) {
          healthVal.className = "metric-value status-good";
          statusVal.className = "metric-value status-good";
          statusVal.innerText = "Normal";
        } else if (health > 45) {
          healthVal.className = "metric-value status-warn";
          statusVal.className = "metric-value status-warn";
          statusVal.innerText = "Moderate Stress";
        } else {
          healthVal.className = "metric-value status-crit";
          statusVal.className = "metric-value status-crit";
          statusVal.innerText = "Severe Pathology";
        }

        let descText = base.desc;
        if (smokingActive || alcoholActive || opioidActive) {
          descText = `Impact over ${yearsExposure} year(s): Active chemical toxicity induces cellular inflammation, vascular hypoxia, and tissue necrosis.`;
        }
        cardDesc.innerText = descText;
      };

      // Navigation & Controls Event Listeners
      document.querySelectorAll(".nav-tab").forEach((tab) => {
        tab.addEventListener("click", (e) => {
          document.querySelectorAll(".nav-tab").forEach((t) => t.classList.remove("active"));
          e.target.classList.add("active");
          activeOrgan = e.target.dataset.organ;
          updateDashboard();
        });
      });

      yearsSlider.addEventListener("input", (e) => {
        yearsExposure = parseInt(e.target.value);
        yearsVal.innerText = `${yearsExposure} Year${yearsExposure > 1 ? 's' : ''}`;
        applyPathologyToMesh();
        updateDashboard();
      });

      const setupToggle = (id, getter, setter) => {
        const btn = document.getElementById(id);
        btn.addEventListener("click", () => {
          setter(!getter());
          btn.classList.toggle("active", getter());
          applyPathologyToMesh();
          updateDashboard();
        });
      };

      setupToggle("btn-alcohol", () => alcoholActive, (val) => alcoholActive = val);
      setupToggle("btn-smoking", () => smokingActive, (val) => smokingActive = val);
      setupToggle("btn-opioid", () => opioidActive, (val) => opioidActive = val);

      document.getElementById("btn-zoom-in").addEventListener("click", () => {
        document.querySelectorAll(".target-model").forEach((model) => {
          if (model.components['gesture-controls']) model.components['gesture-controls'].zoomIn();
        });
      });

      document.getElementById("btn-zoom-out").addEventListener("click", () => {
        document.querySelectorAll(".target-model").forEach((model) => {
          if (model.components['gesture-controls']) model.components['gesture-controls'].zoomOut();
        });
      });

      const targets = document.querySelectorAll("[mindar-image-target]");
      targets.forEach((target) => {
        target.addEventListener("targetFound", (event) => {
          activeTarget = event.target.id;
          setTimeout(applyPathologyToMesh, 200);
          updateDashboard();
          dashboardCard.style.display = "block";
        });

        target.addEventListener("targetLost", () => {
          activeTarget = null;
          dashboardCard.style.display = "none";
        });
      });
    });
  </script>

</body>
</html>
