<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OrganoAR — Educational Medical Simulator</title>

  <!-- A-Frame & MindAR Libraries -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <!-- Touch Controls -->
  <script>
    AFRAME.registerComponent('gesture-controls', {
      schema: {
        rotationFactor: { type: 'number', default: 5 },
        zoomStep: { type: 'number', default: 0.5 },
        minScale: { type: 'number', default: 0.5 },
        maxScale: { type: 'number', default: 10.0 }
      },
      init: function () {
        this.handleTouchStart = this.handleTouchStart.bind(this);
        this.handleTouchMove = this.handleTouchMove.bind(this);
        this.touchX = 0;
        this.touchY = 0;
        window.addEventListener('touchstart', this.handleTouchStart, { passive: false });
        window.addEventListener('touchmove', this.handleTouchMove, { passive: false });
      },
      handleTouchStart: function (evt) {
        if (evt.touches.length === 1) {
          this.touchX = evt.touches[0].clientX;
          this.touchY = evt.touches[0].clientY;
        }
      },
      handleTouchMove: function (evt) {
        if (evt.touches.length === 1) {
          const deltaX = evt.touches[0].clientX - this.touchX;
          const deltaY = evt.touches[0].clientY - this.touchY;
          const currentRotation = this.el.getAttribute('rotation');
          this.el.setAttribute('rotation', {
            x: currentRotation.x + deltaY * (this.data.rotationFactor * 0.1),
            y: currentRotation.y + deltaX * (this.data.rotationFactor * 0.1),
            z: currentRotation.z
          });
          this.touchX = evt.touches[0].clientX;
          this.touchY = evt.touches[0].clientY;
        }
      },
      zoomIn: function () {
        const currentScale = this.el.getAttribute('scale');
        let newScale = Math.min(currentScale.x + this.data.zoomStep, this.data.maxScale);
        this.el.setAttribute('scale', { x: newScale, y: newScale, z: newScale });
      },
      zoomOut: function () {
        const currentScale = this.el.getAttribute('scale');
        let newScale = Math.max(currentScale.x - this.data.zoomStep, this.data.minScale);
        this.el.setAttribute('scale', { x: newScale, y: newScale, z: newScale });
      }
    });
  </script>

  <style>
    :root {
      --bg-glass: rgba(15, 23, 42, 0.85);
      --border-glass: rgba(255, 255, 255, 0.12);
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
      background: #020617;
      color: var(--text);
    }

    /* Top Organ Selector */
    #top-nav {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      padding: 4px;
      border-radius: 20px;
      border: 1px solid var(--border-glass);
      z-index: 2000;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 16px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-btn.active {
      background: var(--accent);
      color: #020617;
    }

    /* Unified Bottom Dashboard */
    #bottom-dashboard {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 420px;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      padding: 16px;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Substance Selector Row */
    .substance-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .substance-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      color: var(--text);
      padding: 8px;
      border-radius: 12px;
      font-size: 0.78rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
    }

    .substance-btn.active {
      background: rgba(244, 63, 94, 0.2);
      border-color: #f43f5e;
      color: #f43f5e;
    }

    /* Slider & Zoom Controls */
    .controls-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .slider-container {
      flex: 1;
    }

    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    input[type=range] {
      width: 100%;
      accent-color: var(--accent);
    }

    .zoom-group {
      display: flex;
      gap: 4px;
    }

    .zoom-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-glass);
      color: var(--accent);
      font-weight: bold;
      cursor: pointer;
    }

    /* Info Section */
    .info-section {
      border-top: 1px solid var(--border-glass);
      padding-top: 10px;
    }

    .info-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .info-title {
      font-weight: 700;
      color: var(--accent);
      font-size: 0.9rem;
    }

    .info-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
    }

    .info-desc {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin: 0;
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <!-- Top Organ Navigation -->
  <div id="top-nav">
    <button class="nav-btn active" data-organ="liver">Liver</button>
    <button class="nav-btn" data-organ="brain">Brain</button>
    <button class="nav-btn" data-organ="lungs">Lungs</button>
  </div>

  <!-- Unified Bottom Control Dashboard -->
  <div id="bottom-dashboard">
    <!-- Substance Toggles -->
    <div class="substance-row">
      <button class="substance-btn" id="btn-alcohol">🍺 Alcohol</button>
      <button class="substance-btn" id="btn-tobacco">🚬 Tobacco</button>
      <button class="substance-btn" id="btn-opioid">💊 Opioids</button>
    </div>

    <!-- Timeline Slider & Inline Zoom -->
    <div class="controls-row">
      <div class="slider-container">
        <div class="slider-header">
          <span>Exposure Duration</span>
          <span id="years-val">1 Year</span>
        </div>
        <input type="range" id="years-slider" min="1" max="20" value="1" step="1">
      </div>
      <div class="zoom-group">
        <button class="zoom-btn" id="btn-zoom-out">−</button>
        <button class="zoom-btn" id="btn-zoom-in">+</button>
      </div>
    </div>

    <!-- Dynamic Medical Information -->
    <div class="info-section">
      <div class="info-header">
        <span class="info-title" id="card-title">Anterior View [LIVER]</span>
        <span class="info-badge" id="health-badge">Efficiency: 100%</span>
      </div>
      <p class="info-desc" id="card-desc">Scan a flashcard to inspect structures.</p>
    </div>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: ./livertargets.mind; autoStart: true;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <a-asset-item id="liverModel" src="./liver.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-light type="ambient" intensity="1.8"></a-light>
    <a-light type="directional" position="1 2 3" intensity="2.5"></a-light>

    <!-- TARGET 0: Anterior View -->
    <a-entity mindar-image-target="targetIndex: 0" id="target-0">
      <a-gltf-model class="target-model" src="#liverModel" position="0 0 0.2" scale="2.5 2.5 2.5" rotation="0 0 0" gesture-controls></a-gltf-model>
    </a-entity>

    <!-- TARGET 1: Posterior View -->
    <a-entity mindar-image-target="targetIndex: 1" id="target-1">
      <a-gltf-model class="target-model" src="#liverModel" position="0 0 0.2" scale="2.5 2.5 2.5" rotation="0 180 0" gesture-controls></a-gltf-model>
    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      let activeTarget = "target-0";
      let alcoholActive = false;
      let tobaccoActive = false;
      let opioidActive = false;
      let yearsExposure = 1;

      const healthBadge = document.getElementById("health-badge");
      const cardDesc = document.getElementById("card-desc");

      const updateUI = () => {
        let health = 100;
        let factor = (alcoholActive ? 2 : 0) + (tobaccoActive ? 1.5 : 0) + (opioidActive ? 2.5 : 0);
        health = Math.max(12, 100 - Math.round(yearsExposure * factor));

        healthBadge.innerText = `Efficiency: ${health}%`;
        if (health > 70) {
          healthBadge.style.background = "rgba(16, 185, 129, 0.15)";
          healthBadge.style.color = "#10b981";
        } else {
          healthBadge.style.background = "rgba(244, 63, 94, 0.15)";
          healthBadge.style.color = "#f43f5e";
        }

        if (alcoholActive || tobaccoActive || opioidActive) {
          cardDesc.innerText = `Impact over ${yearsExposure} year(s): Active chemical toxicity induces cellular inflammation, vascular hypoxia, and tissue degradation.`;
        } else {
          cardDesc.innerText = "Scan a flashcard to inspect structures.";
        }

        // Apply Material Color Changes
        document.querySelectorAll(".target-model").forEach((modelEl) => {
          const mesh = modelEl.getObject3D('mesh');
          if (!mesh) return;
          mesh.traverse((node) => {
            if (node.isMesh && node.material) {
              let targetColor = new THREE.Color(0xffffff);
              if (alcoholActive || tobaccoActive || opioidActive) {
                const dark = 1.0 - ((yearsExposure / 20) * 0.5);
                targetColor.multiplyScalar(dark);
              }
              node.material.color = targetColor;
              node.material.needsUpdate = true;
            }
          });
        });
      };

      // Toggle Handlers
      document.getElementById("btn-alcohol").addEventListener("click", (e) => {
        alcoholActive = !alcoholActive;
        e.target.classList.toggle("active", alcoholActive);
        updateUI();
      });

      document.getElementById("btn-tobacco").addEventListener("click", (e) => {
        tobaccoActive = !tobaccoActive;
        e.target.classList.toggle("active", tobaccoActive);
        updateUI();
      });

      document.getElementById("btn-opioid").addEventListener("click", (e) => {
        opioidActive = !opioidActive;
        e.target.classList.toggle("active", opioidActive);
        updateUI();
      });

      document.getElementById("years-slider").addEventListener("input", (e) => {
        yearsExposure = parseInt(e.target.value);
        document.getElementById("years-val").innerText = `${yearsExposure} Year${yearsExposure > 1 ? 's' : ''}`;
        updateUI();
      });

      document.getElementById("btn-zoom-in").addEventListener("click", () => {
        document.querySelectorAll(".target-model").forEach(m => m.components['gesture-controls']?.zoomIn());
      });

      document.getElementById("btn-zoom-out").addEventListener("click", () => {
        document.querySelectorAll(".target-model").forEach(m => m.components['gesture-controls']?.zoomOut());
      });
    });
  </script>

</body>
</html>
