<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>OrganoAR — Clinical Spatial Suite</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    :root {
      --surface-base: rgba(15, 23, 42, 0.85);
      --border-light: rgba(255, 255, 255, 0.12);
      --brand-primary: #38bdf8;
      --status-danger: #f43f5e;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --radius-pill: 9999px;
      --radius-card: 20px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: transparent !important;
      color: var(--text-main);
    }

    /* Force A-Frame WebGL canvas to remain transparent above camera video stream */
    a-scene {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: transparent !important;
    }

    .a-canvas {
      background: transparent !important;
    }

    /* SSO Auth Overlay */
    #authOverlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: radial-gradient(circle at 50% 20%, #1e293b, #020617);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .auth-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-light);
      border-radius: 28px;
      padding: 40px 32px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      color: var(--brand-primary);
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .auth-title { font-size: 1.5rem; font-weight: 700; margin: 0 0 8px 0; }
    .auth-desc { font-size: 0.875rem; color: var(--text-sub); margin: 0 0 32px 0; line-height: 1.5; }

    .sso-group { display: flex; flex-direction: column; gap: 12px; }

    .sso-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .sso-button:active { transform: scale(0.98); background: rgba(255, 255, 255, 0.15); }

    /* Scan Banner */
    #scanBanner {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface-base);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-light);
      padding: 10px 22px;
      border-radius: var(--radius-pill);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--brand-primary);
      z-index: 100;
      display: none;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    /* Bottom HUD Controls */
    .hud-overlay {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      width: calc(100% - 32px);
      max-width: 420px;
      display: none;
    }

    .hud-card {
      background: var(--surface-base);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-card);
      padding: 16px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-header { display: flex; justify-content: space-between; align-items: center; }
    .organ-label { font-size: 0.9rem; font-weight: 700; color: var(--brand-primary); letter-spacing: 0.5px; }

    .health-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      background: rgba(56, 189, 248, 0.15);
      color: var(--brand-primary);
    }

    .health-badge.is-warning { background: rgba(244, 63, 94, 0.15); color: var(--status-danger); }

    .substance-group { display: flex; gap: 8px; }

    .substance-chip {
      flex: 1;
      padding: 8px 4px;
      border: 1px solid var(--border-light);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
    }

    .substance-chip.is-active {
      background: rgba(244, 63, 94, 0.2);
      border-color: var(--status-danger);
      color: var(--status-danger);
    }

    .slider-row { display: flex; flex-direction: column; gap: 6px; }
    .slider-header { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--text-sub); font-weight: 600; }
    .controls-wrapper { display: flex; align-items: center; gap: 12px; }

    input[type=range] {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.15);
      accent-color: var(--brand-primary);
    }

    .zoom-group { display: flex; gap: 4px; }

    .zoom-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid var(--border-light);
      background: rgba(255, 255, 255, 0.06);
      color: var(--brand-primary);
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Modal Info Card */
    #infoModal {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 380px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--brand-primary);
      border-radius: 16px;
      padding: 14px 18px;
      z-index: 200;
      display: none;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.6);
    }

    .modal-header { display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 0.875rem; font-weight: 700; color: var(--brand-primary); }
    .modal-close { background: none; border: none; color: var(--text-sub); font-size: 1.2rem; cursor: pointer; }
    .modal-body { font-size: 0.8rem; color: var(--text-sub); margin-top: 6px; line-height: 1.4; }
  </style>

  <script>
    AFRAME.registerComponent('viewport-controls', {
      schema: { rotateSpeed: { type: 'number', default: 0.5 }, scaleStep: { type: 'number', default: 0.15 } },
      init: function () {
        this.lastX = 0;
        this.lastY = 0;
        window.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) {
            this.lastX = e.touches[0].clientX;
            this.lastY = e.touches[0].clientY;
          }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
          if (e.touches.length === 1) {
            const deltaX = e.touches[0].clientX - this.lastX;
            const deltaY = e.touches[0].clientY - this.lastY;
            const rot = this.el.getAttribute('rotation');

            this.el.setAttribute('rotation', {
              x: rot.x + deltaY * this.data.rotateSpeed,
              y: rot.y + deltaX * this.data.rotateSpeed,
              z: rot.z
            });

            this.lastX = e.touches[0].clientX;
            this.lastY = e.touches[0].clientY;
          }
        }, { passive: true });
      },
      adjustScale: function (dir) {
        const currentScale = this.el.getAttribute('scale').x;
        let newScale = currentScale + (dir * this.data.scaleStep);
        newScale = Math.min(Math.max(newScale, 0.3), 2.2);
        this.el.setAttribute('scale', `${newScale} ${newScale} ${newScale}`);
      }
    });

    AFRAME.registerComponent('anatomical-hotspot', {
      schema: {
        title: { type: 'string', default: 'Structure' },
        details: { type: 'string', default: 'Details' }
      },
      init: function () {
        this.el.addEventListener('click', () => {
          document.getElementById("infoTitle").innerText = this.data.title;
          document.getElementById("infoBody").innerText = this.data.details;
          document.getElementById("infoModal").style.display = "block";
        });
      }
    });
  </script>
</head>
<body>

  <div id="authOverlay">
    <div class="auth-card">
      <div class="brand-pill">✨ OrganoAR Enterprise</div>
      <h1 class="auth-title">Clinical Spatial Suite</h1>
      <p class="auth-desc">Sign in to initialize real-time anatomical target recognition and interactive 3D models.</p>

      <div class="sso-group">
        <button class="sso-button" onclick="loginAndStartAR('Google')">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Continue with Google
        </button>

        <button class="sso-button" onclick="loginAndStartAR('Microsoft')">
          <svg width="18" height="18" viewBox="0 0 23 23"><path fill="#f35325" d="M1 1h10v10H1z"/><path fill="#81bc06" d="M12 1h10v10H12z"/><path fill="#05a6f0" d="M1 12h10v10H1z"/><path fill="#ffba08" d="M12 12h10v10H12z"/></svg>
          Continue with Microsoft
        </button>
      </div>
    </div>
  </div>

  <div id="scanBanner">📷 Point camera at any flashcard</div>

  <div id="infoModal">
    <div class="modal-header">
      <span class="modal-title" id="infoTitle">Structure</span>
      <button class="modal-close" onclick="document.getElementById('infoModal').style.display='none'">×</button>
    </div>
    <div class="modal-body" id="infoBody">Details</div>
  </div>

  <main class="hud-overlay" id="hudControls">
    <section class="hud-card">
      <div class="card-header">
        <span class="organ-label" id="organTitle">ORGAN PATHOLOGY</span>
        <span class="health-badge" id="healthBadge">Efficiency 100%</span>
      </div>

      <div class="substance-group" id="substanceGroup">
        <button class="substance-chip" data-factor="alcohol">🍺 Alcohol</button>
        <button class="substance-chip" data-factor="tobacco">🚬 Tobacco</button>
        <button class="substance-chip" data-factor="substance">💊 Opioids</button>
      </div>

      <div class="slider-row">
        <div class="slider-header">
          <span>Exposure Timeline</span>
          <span id="yearLabel">1 Year</span>
        </div>
        <div class="controls-wrapper">
          <input type="range" id="yearSlider" min="1" max="20" value="1">
          <div class="zoom-group">
            <button class="zoom-btn" id="zoomOutBtn">−</button>
            <button class="zoom-btn" id="zoomInBtn">+</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <a-scene 
    mindar-image="imageTargetSrc: ./assets/targets/organs.mind; autoStart: false; uiScanning: no;" 
    embedded
    color-space="sRGB" 
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true; antialias: true;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false"
    cursor="rayOrigin: mouse"
    raycaster="objects: .raycastable">
    
    <a-assets>
      <a-asset-item id="liverModel" src="./assets/models/liver.glb"></a-asset-item>
      <a-asset-item id="heartModel" src="./assets/models/heart.glb"></a-asset-item>
      <a-asset-item id="lungModel" src="./assets/models/lung.glb"></a-asset-item>
      <a-asset-item id="kidneyModel" src="./assets/models/kidney.glb"></a-asset-item>
      <a-asset-item id="stomachModel" src="./assets/models/stomach.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-light type="ambient" intensity="1.8"></a-light>
    <a-light type="directional" position="1 2 3" intensity="2.0"></a-light>

    <a-entity mindar-image-target="targetIndex: 0" id="target-liver">
      <a-gltf-model class="ar-model" data-organ="LIVER" src="#liverModel" position="0 0 0" scale="0.8 0.8 0.8" viewport-controls></a-gltf-model>
      <a-entity position="0 0 0">
        <a-sphere class="raycastable" position="0.15 0.15 0.1" radius="0.04" color="#38bdf8" anatomical-hotspot="title: Hepatic Portal Vein; details: Supplies 75% of liver blood flow. Chronic toxicity causes portal hypertension."></a-sphere>
      </a-entity>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 1" id="target-heart">
      <a-gltf-model class="ar-model" data-organ="HEART" src="#heartModel" position="0 0 0" scale="0.8 0.8 0.8" viewport-controls></a-gltf-model>
      <a-entity position="0 0 0">
        <a-sphere class="raycastable" position="0 0.2 0.1" radius="0.04" color="#38bdf8" anatomical-hotspot="title: Aortic Arch; details: Main arterial trunk. Nicotine exposure increases arterial wall stiffness."></a-sphere>
      </a-entity>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 2" id="target-lungs">
      <a-gltf-model class="ar-model" data-organ="LUNGS" src="#lungModel" position="0 0 0" scale="0.8 0.8 0.8" viewport-controls></a-gltf-model>
      <a-entity position="0 0 0">
        <a-sphere class="raycastable" position="0.1 0.1 0.1" radius="0.04" color="#38bdf8" anatomical-hotspot="title: Bronchial Tree; details: Airway passages. Carbon deposits cause chronic bronchitis and reduced elasticity."></a-sphere>
      </a-entity>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 3" id="target-kidneys">
      <a-gltf-model class="ar-model" data-organ="KIDNEYS" src="#kidneyModel" position="0 0 0" scale="0.8 0.8 0.8" viewport-controls></a-gltf-model>
      <a-entity position="0 0 0">
        <a-sphere class="raycastable" position="0 0.15 0.1" radius="0.04" color="#38bdf8" anatomical-hotspot="title: Renal Cortex; details: Contains nephrons. Prolonged chemical exposure causes glomerulosclerosis."></a-sphere>
      </a-entity>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 4" id="target-stomach">
      <a-gltf-model class="ar-model" data-organ="STOMACH" src="#stomachModel" position="0 0 0" scale="0.8 0.8 0.8" viewport-controls></a-gltf-model>
      <a-entity position="0 0 0">
        <a-sphere class="raycastable" position="0.05 0.1 0.1" radius="0.04" color="#38bdf8" anatomical-hotspot="title: Gastric Mucosa; details: Protective epithelial layer. Alcohol dissolves this barrier, generating ulcers."></a-sphere>
      </a-entity>
    </a-entity>

  </a-scene>

  <script>
    const AppState = {
      activeOrgan: "LIVER",
      years: 1,
      factors: { alcohol: false, tobacco: false, substance: false }
    };

    // Explicit Gesture Handler Triggering Native Camera Permissions
    async function loginAndStartAR(provider) {
      document.getElementById("authOverlay").style.display = "none";
      document.getElementById("scanBanner").style.display = "block";

      try {
        // Explicit MediaStream Request triggers native iOS/Android camera permission dialog
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        
        // Stop temporary stream so MindAR takes control cleanly
        stream.getTracks().forEach(track => track.stop());

        // Start MindAR Engine
        const sceneEl = document.querySelector("a-scene");
        const arSystem = sceneEl.systems["mindar-image-system"];
        if (arSystem) arSystem.start();
      } catch (err) {
        alert("Camera Access Denied or Unavailable: Please allow camera permissions in your browser settings.");
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const organTitle = document.getElementById("organTitle");
      const healthBadge = document.getElementById("healthBadge");
      const yearLabel = document.getElementById("yearLabel");
      const yearSlider = document.getElementById("yearSlider");
      const scanBanner = document.getElementById("scanBanner");
      const hudControls = document.getElementById("hudControls");

      const render = () => {
        let activeFactorCount = Object.values(AppState.factors).filter(Boolean).length;
        let healthValue = Math.max(12, 100 - (AppState.years * activeFactorCount * 2.2));

        organTitle.innerText = `${AppState.activeOrgan} PATHOLOGY`;
        yearLabel.innerText = `${AppState.years} Year${AppState.years > 1 ? 's' : ''}`;
        healthBadge.innerText = `Efficiency ${Math.round(healthValue)}%`;

        if (healthValue < 65) {
          healthBadge.classList.add("is-warning");
        } else {
          healthBadge.classList.remove("is-warning");
        }

        document.querySelectorAll(".ar-model").forEach((modelEl) => {
          const mesh = modelEl.getObject3D('mesh');
          if (!mesh) return;

          const yearRatio = AppState.years / 20.0;
          let baseScale = 0.8;
          let shrinkScale = baseScale - (yearRatio * 0.2 * activeFactorCount);
          modelEl.setAttribute("scale", `${shrinkScale} ${shrinkScale} ${shrinkScale}`);

          mesh.traverse((node) => {
            if (node.isMesh && node.material) {
              let color = new THREE.Color(0xffffff);
              let roughness = 0.4;

              if (activeFactorCount > 0) {
                if (AppState.factors.alcohol && !AppState.factors.tobacco && !AppState.factors.substance) {
                  color.lerp(new THREE.Color(0xd97706), yearRatio * 0.85);
                  roughness = 0.2;
                } else if (AppState.factors.tobacco && !AppState.factors.alcohol && !AppState.factors.substance) {
                  color.lerp(new THREE.Color(0x1e293b), yearRatio * 0.90);
                  roughness = 0.85;
                } else if (AppState.factors.substance && !AppState.factors.alcohol && !AppState.factors.tobacco) {
                  color.lerp(new THREE.Color(0x581c87), yearRatio * 0.88);
                  roughness = 0.6;
                } else {
                  color.lerp(new THREE.Color(0x270707), yearRatio * 0.95);
                  roughness = 0.95;
                }
                color.multiplyScalar(1.0 - (yearRatio * 0.45));
              }

              node.material.color = color;
              node.material.roughness = roughness;
              node.material.needsUpdate = true;
            }
          });
        });
      };

      // Target Detection Event Handlers
      document.querySelectorAll("[mindar-image-target]").forEach((targetEl) => {
        targetEl.addEventListener("targetFound", () => {
          const modelEl = targetEl.querySelector(".ar-model");
          if (modelEl) {
            AppState.activeOrgan = modelEl.dataset.organ;
            
            scanBanner.innerText = `✅ DETECTED: ${AppState.activeOrgan}`;
            scanBanner.style.borderColor = "#38bdf8";
            hudControls.style.display = "block"; 
            
            render();
          }
        });

        targetEl.addEventListener("targetLost", () => {
          scanBanner.innerText = "📷 Point camera at any flashcard";
          scanBanner.style.borderColor = "rgba(255, 255, 255, 0.12)";
          
          hudControls.style.display = "none"; 
          document.getElementById("infoModal").style.display = "none";
        });
      });

      // Factor Buttons
      document.getElementById("substanceGroup").addEventListener("click", (e) => {
        const chip = e.target.closest(".substance-chip");
        if (!chip) return;

        const factor = chip.dataset.factor;
        AppState.factors[factor] = !AppState.factors[factor];
        chip.classList.toggle("is-active", AppState.factors[factor]);
        render();
      });

      // Slider
      yearSlider.addEventListener("input", (e) => {
        AppState.years = parseInt(e.target.value, 10);
        render();
      });

      // Zoom Controls
      document.getElementById("zoomInBtn").addEventListener("click", () => {
        document.querySelectorAll(".ar-model").forEach(el => {
          el.components['viewport-controls']?.adjustScale(1);
        });
      });

      document.getElementById("zoomOutBtn").addEventListener("click", () => {
        document.querySelectorAll(".ar-model").forEach(el => {
          el.components['viewport-controls']?.adjustScale(-1);
        });
      });
    });
  </script>
</body>
</html>
