<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>OrganoAR — Spatial Health Experience</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    :root {
      --sys-color-surface: rgba(18, 24, 38, 0.82);
      --sys-color-surface-hover: rgba(255, 255, 255, 0.08);
      --sys-color-primary: #38bdf8;
      --sys-color-danger: #fb7185;
      --sys-color-text-main: #f8fafc;
      --sys-color-text-sub: #94a3b8;
      --sys-radius-sheet: 28px;
      --sys-radius-chip: 14px;
      --sys-radius-pill: 9999px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #020617 !important;
      color: var(--sys-color-text-main);
    }

    a-scene {
      position: absolute !important;
      inset: 0 !important;
      z-index: 1 !important;
      background: transparent !important;
    }

    .a-canvas { background: transparent !important; }

    /* Humanized Onboarding Gate */
    #welcomeGate {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: radial-gradient(circle at 50% 30%, #1e293b, #020617);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .welcome-card {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 32px;
      padding: 40px 32px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 32px 64px -16px rgba(0, 0, 0, 0.6);
    }

    .app-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.08);
      padding: 6px 16px;
      border-radius: var(--sys-radius-pill);
      color: var(--sys-color-primary);
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: 0.2px;
      margin-bottom: 20px;
    }

    .welcome-title { font-size: 1.625rem; font-weight: 700; margin: 0 0 10px 0; letter-spacing: -0.02em; line-height: 1.2; }
    .welcome-desc { font-size: 0.9375rem; color: var(--sys-color-text-sub); margin: 0 0 32px 0; line-height: 1.5; }

    .sso-stack { display: flex; flex-direction: column; gap: 12px; }

    .btn-sso {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 18px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      color: var(--sys-color-text-main);
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn-sso:active { transform: scale(0.98); background: rgba(255, 255, 255, 0.12); }

    /* Minimalist Camera Guidance Banner */
    #guideBanner {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--sys-color-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 22px;
      border-radius: var(--sys-radius-pill);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--sys-color-text-main);
      z-index: 100;
      display: none;
      box-shadow: 0 12px 24px -6px rgba(0, 0, 0, 0.3);
    }

    /* Native-Style Bottom Control Sheet */
    .sheet-overlay {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      width: calc(100% - 32px);
      max-width: 420px;
      display: none;
    }

    .sheet-card {
      background: var(--sys-color-surface);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--sys-radius-sheet);
      padding: 20px;
      box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sheet-header { display: flex; justify-content: space-between; align-items: center; }
    .organ-heading { font-size: 1.0625rem; font-weight: 700; color: var(--sys-color-text-main); }

    .health-pill {
      font-size: 0.78125rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: var(--sys-radius-pill);
      background: rgba(56, 189, 248, 0.12);
      color: var(--sys-color-primary);
    }

    .health-pill.is-critical { background: rgba(251, 113, 133, 0.15); color: var(--sys-color-danger); }

    .lifestyle-grid { display: flex; gap: 8px; }

    .lifestyle-chip {
      flex: 1;
      padding: 10px 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.03);
      color: var(--sys-color-text-sub);
      font-size: 0.8125rem;
      font-weight: 500;
      border-radius: var(--sys-radius-chip);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .lifestyle-chip.is-active {
      background: rgba(251, 113, 133, 0.15);
      border-color: var(--sys-color-danger);
      color: var(--sys-color-text-main);
      font-weight: 600;
    }

    .slider-container { display: flex; flex-direction: column; gap: 8px; }
    .slider-labels { display: flex; justify-content: space-between; font-size: 0.8125rem; color: var(--sys-color-text-sub); font-weight: 500; }

    input[type=range] {
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.12);
      accent-color: var(--sys-color-primary);
      cursor: pointer;
    }

    /* Humanized Structure Inspection Modal */
    #structureModal {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 380px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 20px;
      padding: 18px 20px;
      z-index: 200;
      display: none;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .modal-header { display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 0.9375rem; font-weight: 700; color: var(--sys-color-primary); }
    .btn-close { background: none; border: none; color: var(--sys-color-text-sub); font-size: 1.25rem; cursor: pointer; padding: 0; }
    .modal-body { font-size: 0.875rem; color: var(--sys-color-text-sub); margin-top: 8px; line-height: 1.45; }
  </style>

  <script>
    // Smooth Touch Gestures: Orbit Rotation & Pinch Zooming
    AFRAME.registerComponent('spatial-gestures', {
      schema: { rotateSpeed: { type: 'number', default: 0.5 } },
      init: function () {
        this.lastX = 0;
        this.lastY = 0;
        this.initialPinchDistance = null;

        window.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) {
            this.lastX = e.touches[0].clientX;
            this.lastY = e.touches[0].clientY;
          } else if (e.touches.length === 2) {
            this.initialPinchDistance = this.getDistance(e.touches);
          }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
          if (e.touches.length === 1) {
            const deltaX = e.touches[0].clientX - this.lastX;
            const deltaY = e.touches[0].clientY - this.lastY;
            const rot = this.el.getAttribute('rotation');

            this.el.setAttribute('rotation', {
              x: rot.x + deltaY * this.data.rotateSpeed,
              y: rot.y + deltaX * this.data.rotateSpeed,
              z: rot.z
            });

            this.lastX = e.touches[0].clientX;
            this.lastY = e.touches[0].clientY;
          } else if (e.touches.length === 2 && this.initialPinchDistance) {
            const currentDistance = this.getDistance(e.touches);
            const factor = currentDistance / this.initialPinchDistance;
            const currentScale = this.el.getAttribute('scale').x;
            
            let newScale = currentScale * factor;
            newScale = Math.min(Math.max(newScale, 0.25), 2.2);

            this.el.setAttribute('scale', `${newScale} ${newScale} ${newScale}`);
            this.initialPinchDistance = currentDistance;
          }
        }, { passive: true });

        window.addEventListener('touchend', () => {
          this.initialPinchDistance = null;
        });
      },
      getDistance: function (touches) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
      }
    });

    // Hotspot Selection Component
    AFRAME.registerComponent('anatomical-hotspot', {
      schema: {
        title: { type: 'string', default: 'Structure' },
        details: { type: 'string', default: 'Details' }
      },
      init: function () {
        this.el.addEventListener('click', () => {
          document.getElementById("modalTitle").innerText = this.data.title;
          document.getElementById("modalBody").innerText = this.data.details;
          document.getElementById("structureModal").style.display = "block";
        });
      }
    });
  </script>
</head>
<body>

  <div id="welcomeGate">
    <div class="welcome-card">
      <div class="app-badge">OrganoAR Spatial Health</div>
      <h1 class="welcome-title">Explore Human Anatomy</h1>
      <p class="welcome-desc">Sign in to begin real-time spatial scanning and understand how lifestyle habits affect organ health.</p>

      <div class="sso-stack">
        <button class="btn-sso" onclick="startCameraExperience('Google')">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Continue with Google
        </button>

        <button class="btn-sso" onclick="startCameraExperience('Microsoft')">
          <svg width="18" height="18" viewBox="0 0 23 23"><path fill="#f35325" d="M1 1h10v10H1z"/><path fill="#81bc06" d="M12 1h10v10H1z"/><path fill="#05a6f0" d="M1 12h10v10H1z"/><path fill="#ffba08" d="M12 12h10v10H12z"/></svg>
          Continue with Microsoft
        </button>
      </div>
    </div>
  </div>

  <div id="guideBanner">Point camera at an organ card</div>

  <div id="structureModal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">Structure</span>
      <button class="btn-close" onclick="document.getElementById('structureModal').style.display='none'">×</button>
    </div>
    <div class="modal-body" id="modalBody">Details</div>
  </div>

  <main class="sheet-overlay" id="sheetControls">
    <section class="sheet-card">
      <div class="sheet-header">
        <span class="organ-heading" id="organHeading">Organ View</span>
        <span class="health-pill" id="healthPill">Health Score 100%</span>
      </div>

      <div class="lifestyle-grid" id="lifestyleGrid">
        <button class="lifestyle-chip" data-factor="alcohol">🍺 Alcohol</button>
        <button class="lifestyle-chip" data-factor="tobacco">🚬 Tobacco</button>
        <button class="lifestyle-chip" data-factor="substance">💊 Opioids</button>
      </div>

      <div class="slider-container">
        <div class="slider-labels">
          <span>Simulate Exposure</span>
          <span id="durationLabel">1 Year</span>
        </div>
        <input type="range" id="exposureSlider" min="1" max="20" value="1">
      </div>
    </section>
  </main>

  <a-scene 
    mindar-image="imageTargetSrc: ./assets/targets/organs.mind; autoStart: false; uiScanning: no;" 
    color-space="sRGB" 
    renderer="colorManagement: true; physicallyCorrectLights: true; alpha: true;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false"
    cursor="rayOrigin: mouse"
    raycaster="objects: .raycastable">
    
    <a-assets>
      <a-asset-item id="liverModel" src="./assets/models/liver.glb"></a-asset-item>
      <a-asset-item id="heartModel" src="./assets/models/heart.glb"></a-asset-item>
      <a-asset-item id="lungModel" src="./assets/models/lung.glb"></a-asset-item>
      <a-asset-item id="kidneyModel" src="./assets/models/kidney.glb"></a-asset-item>
      <a-asset-item id="stomachModel" src="./assets/models/stomach.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-light type="ambient" intensity="1.8"></a-light>
    <a-light type="directional" position="1 2 3" intensity="2.0"></a-light>

    <a-entity mindar-image-target="targetIndex: 0" id="target-liver">
      <a-gltf-model class="ar-model" data-organ="Liver" src="#liverModel" position="0 0 0" scale="0.8 0.8 0.8" spatial-gestures></a-gltf-model>
      <a-entity position="0 0 0.1">
        <a-sphere class="raycastable" position="0.2 0.2 0.1" radius="0.05" color="#38bdf8" anatomical-hotspot="title: Hepatic Portal Vein; details: Carries 75% of blood flow to the liver. Prolonged toxin exposure increases portal vein pressure."></a-sphere>
        <a-text value="Portal Vein" position="0.28 0.2 0.1" scale="0.4 0.4 0.4" color="#f8fafc"></a-text>

        <a-sphere class="raycastable" position="-0.2 -0.1 0.1" radius="0.05" color="#38bdf8" anatomical-hotspot="title: Right Lobe Tissue; details: Key zone for nutrient processing. Heavy alcohol exposure can lead to fatty liver changes."></a-sphere>
        <a-text value="Right Lobe" position="-0.45 -0.1 0.1" scale="0.4 0.4 0.4" color="#f8fafc"></a-text>
      </a-entity>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 1" id="target-heart">
      <a-gltf-model class="ar-model" data-organ="Heart" src="#heartModel" position="0 0 0" scale="0.8 0.8 0.8" spatial-gestures></a-gltf-model>
      <a-entity position="0 0 0.1">
        <a-sphere class="raycastable" position="0 0.3 0.1" radius="0.05" color="#38bdf8" anatomical-hotspot="title: Aortic Arch; details: Distributes oxygenated blood to the body. Nicotine exposure leads to arterial wall stiffening."></a-sphere>
        <a-text value="Aortic Arch" position="0.08 0.3 0.1" scale="0.4 0.4 0.4" color="#f8fafc"></a-text>

        <a-sphere class="raycastable" position="0.2 -0.2 0.1" radius="0.05" color="#38bdf8" anatomical-hotspot="title: Left Ventricle; details: Main pumping chamber. Overexertion causes heart muscle thickening over time."></a-sphere>
        <a-text value="Left Ventricle" position="0.28 -0.2 0.1" scale="0.4 0.4 0.4" color="#f8fafc"></a-text>
      </a-entity>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 2" id="target-lungs">
      <a-gltf-model class="ar-model" data-organ="Lungs" src="#lungModel" position="0 0 0" scale="0.8 0.8 0.8" spatial-gestures></a-gltf-model>
      <a-entity position="0 0 0.1">
        <a-sphere class="raycastable" position="0.15 0.15 0.1" radius="0.05" color="#38bdf8" anatomical-hotspot="title: Bronchial Passages; details: Main airways in the lungs. Smoke particles cause mucosal irritation and elasticity loss."></a-sphere>
        <a-text value="Bronchial Tree" position="0.22 0.15 0.1" scale="0.4 0.4 0.4" color="#f8fafc"></a-text>

        <a-sphere class="raycastable" position="-0.2 -0.2 0.1" radius="0.05" color="#38bdf8" anatomical-hotspot="title: Alveoli Clusters; details: Tiny air sacs responsible for gas exchange. Toxins damage sac walls over time."></a-sphere>
        <a-text value="Alveoli Sacs" position="-0.45 -0.2 0.1" scale="0.4 0.4 0.4" color="#f8fafc"></a-text>
      </a-entity>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 3" id="target-kidneys">
      <a-gltf-model class="ar-model" data-organ="Kidneys" src="#kidneyModel" position="0 0 0" scale="0.8 0.8 0.8" spatial-gestures></a-gltf-model>
      <a-entity position="0 0 0.1">
        <a-sphere class="raycastable" position="0 0.2 0.1" radius="0.05" color="#38bdf8" anatomical-hotspot="title: Renal Cortex; details: Contains filtering nephrons. Sustained chemical strain affects overall filtration capacity."></a-sphere>
        <a-text value="Renal Cortex" position="0.08 0.2 0.1" scale="0.4 0.4 0.4" color="#f8fafc"></a-text>
      </a-entity>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 4" id="target-stomach">
      <a-gltf-model class="ar-model" data-organ="Stomach" src="#stomachModel" position="0 0 0" scale="0.8 0.8 0.8" spatial-gestures></a-gltf-model>
      <a-entity position="0 0 0.1">
        <a-sphere class="raycastable" position="0.1 0.1 0.1" radius="0.05" color="#38bdf8" anatomical-hotspot="title: Gastric Lining; details: Protective inner mucus layer. Heavy alcohol use irritates this barrier over time."></a-sphere>
        <a-text value="Gastric Lining" position="0.18 0.1 0.1" scale="0.4 0.4 0.4" color="#f8fafc"></a-text>
      </a-entity>
    </a-entity>

  </a-scene>

  <script>
    const AppState = {
      activeOrgan: "Liver",
      years: 1,
      factors: { alcohol: false, tobacco: false, substance: false }
    };

    async function startCameraExperience(provider) {
      document.getElementById("welcomeGate").style.display = "none";
      document.getElementById("guideBanner").style.display = "block";

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { facingMode: "environment" } 
        });

        stream.getTracks().forEach(track => track.stop());

        const sceneEl = document.querySelector("a-scene");
        const arSystem = sceneEl.systems["mindar-image-system"];
        if (arSystem) {
          arSystem.start();
        }
      } catch (err) {
        alert("Camera Access Required: Please allow camera permissions in your browser settings to scan flashcards.");
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const organHeading = document.getElementById("organHeading");
      const healthPill = document.getElementById("healthPill");
      const durationLabel = document.getElementById("durationLabel");
      const exposureSlider = document.getElementById("exposureSlider");
      const guideBanner = document.getElementById("guideBanner");
      const sheetControls = document.getElementById("sheetControls");

      const render = () => {
        let activeFactorCount = Object.values(AppState.factors).filter(Boolean).length;
        let healthScore = Math.max(15, 100 - (AppState.years * activeFactorCount * 2.2));

        organHeading.innerText = `${AppState.activeOrgan} Health View`;
        durationLabel.innerText = `${AppState.years} Year${AppState.years > 1 ? 's' : ''}`;
        healthPill.innerText = `Health Score ${Math.round(healthScore)}%`;

        if (healthScore < 65) {
          healthPill.classList.add("is-critical");
        } else {
          healthPill.classList.remove("is-critical");
        }

        document.querySelectorAll(".ar-model").forEach((modelEl) => {
          const mesh = modelEl.getObject3D('mesh');
          if (!mesh) return;

          const yearRatio = AppState.years / 20.0;
          let baseScale = 0.8;
          let shrinkScale = baseScale - (yearRatio * 0.18 * activeFactorCount);
          modelEl.setAttribute("scale", `${shrinkScale} ${shrinkScale} ${shrinkScale}`);

          mesh.traverse((node) => {
            if (node.isMesh && node.material) {
              let color = new THREE.Color(0xffffff);
              let roughness = 0.4;

              if (activeFactorCount > 0) {
                if (AppState.factors.alcohol && !AppState.factors.tobacco && !AppState.factors.substance) {
                  color.lerp(new THREE.Color(0xd97706), yearRatio * 0.85);
                  roughness = 0.2;
                } else if (AppState.factors.tobacco && !AppState.factors.alcohol && !AppState.factors.substance) {
                  color.lerp(new THREE.Color(0x1e293b), yearRatio * 0.90);
                  roughness = 0.85;
                } else if (AppState.factors.substance && !AppState.factors.alcohol && !AppState.factors.tobacco) {
                  color.lerp(new THREE.Color(0x581c87), yearRatio * 0.88);
                  roughness = 0.6;
                } else {
                  color.lerp(new THREE.Color(0x270707), yearRatio * 0.95);
                  roughness = 0.95;
                }
                color.multiplyScalar(1.0 - (yearRatio * 0.45));
              }

              node.material.color = color;
              node.material.roughness = roughness;
              node.material.needsUpdate = true;
            }
          });
        });
      };

      document.querySelectorAll("[mindar-image-target]").forEach((targetEl) => {
        targetEl.addEventListener("targetFound", () => {
          const modelEl = targetEl.querySelector(".ar-model");
          if (modelEl) {
            AppState.activeOrgan = modelEl.dataset.organ;
            
            guideBanner.innerText = `Viewing ${AppState.activeOrgan}`;
            guideBanner.style.borderColor = "#38bdf8";
            sheetControls.style.display = "block"; 
            
            render();
          }
        });

        targetEl.addEventListener("targetLost", () => {
          guideBanner.innerText = "Point camera at an organ card";
          guideBanner.style.borderColor = "rgba(255, 255, 255, 0.1)";
          
          sheetControls.style.display = "none"; 
          document.getElementById("structureModal").style.display = "none";
        });
      });

      document.getElementById("lifestyleGrid").addEventListener("click", (e) => {
        const chip = e.target.closest(".lifestyle-chip");
        if (!chip) return;

        const factor = chip.dataset.factor;
        AppState.factors[factor] = !AppState.factors[factor];
        chip.classList.toggle("is-active", AppState.factors[factor]);
        render();
      });

      exposureSlider.addEventListener("input", (e) => {
        AppState.years = parseInt(e.target.value, 10);
        render();
      });
    });
  </script>
</body>
</html>
