<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OrganoAR — Multi-Organ Spatial Pathology Suite</title>

  <!-- Core WebAR & 3D Libraries -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    :root {
      --md-surface: #0f172a;
      --md-surface-container: rgba(30, 41, 59, 0.85);
      --md-outline: rgba(255, 255, 255, 0.1);
      --md-primary: #38bdf8;
      --md-primary-container: rgba(56, 189, 248, 0.12);
      --md-error: #f43f5e;
      --md-error-container: rgba(244, 63, 94, 0.12);
      --md-text-primary: #f8fafc;
      --md-text-secondary: #94a3b8;
      --md-radius-full: 9999px;
      --md-radius-lg: 16px;
      --md-radius-md: 12px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #020617;
      color: var(--md-text-primary);
    }

    /* Top Navigation Segment */
    .organ-bar-container {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      width: calc(100% - 32px);
      max-width: 480px;
    }

    .organ-bar {
      display: flex;
      gap: 4px;
      background: var(--md-surface-container);
      backdrop-filter: blur(20px);
      border: 1px solid var(--md-outline);
      padding: 4px;
      border-radius: var(--md-radius-full);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .organ-bar::-webkit-scrollbar { display: none; }

    .organ-chip {
      flex: 1;
      min-width: 72px;
      padding: 8px 12px;
      border: none;
      background: transparent;
      color: var(--md-text-secondary);
      font-size: 0.8125rem;
      font-weight: 500;
      border-radius: var(--md-radius-full);
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
      white-space: nowrap;
      text-align: center;
    }

    .organ-chip.is-active {
      background: var(--md-primary);
      color: #020617;
      font-weight: 600;
    }

    /* Bottom Control Surface */
    .viewport-overlay {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      width: calc(100% - 32px);
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .surface-card {
      background: var(--md-surface-container);
      backdrop-filter: blur(20px);
      border: 1px solid var(--md-outline);
      border-radius: var(--md-radius-lg);
      padding: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
    }

    /* Factor Selection Group */
    .factor-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .factor-chip {
      flex: 1;
      padding: 10px 8px;
      border: 1px solid var(--md-outline);
      background: rgba(255, 255, 255, 0.03);
      color: var(--md-text-primary);
      font-size: 0.8125rem;
      font-weight: 500;
      border-radius: var(--md-radius-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .factor-chip.is-active {
      background: var(--md-error-container);
      border-color: var(--md-error);
      color: var(--md-error);
    }

    /* Slider Row */
    .timeline-control {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .timeline-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--md-text-secondary);
      font-weight: 500;
    }

    .timeline-slider-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    input[type=range] {
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.12);
      accent-color: var(--md-primary);
      cursor: pointer;
    }

    .zoom-btn-group {
      display: flex;
      gap: 4px;
    }

    .icon-button {
      width: 32px;
      height: 32px;
      border-radius: var(--md-radius-md);
      border: 1px solid var(--md-outline);
      background: rgba(255, 255, 255, 0.04);
      color: var(--md-primary);
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Info Header */
    .info-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--md-outline);
    }

    .info-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--md-text-primary);
    }

    .status-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--md-radius-full);
      background: var(--md-primary-container);
      color: var(--md-primary);
    }

    .status-badge.is-warning {
      background: var(--md-error-container);
      color: var(--md-error);
    }

    .info-description {
      font-size: 0.8125rem;
      line-height: 1.4;
      color: var(--md-text-secondary);
      margin: 6px 0 0 0;
    }
  </style>

  <script>
    // Touch Gesture Component for Object Rotation and Scaling
    AFRAME.registerComponent('viewport-gestures', {
      schema: {
        rotateSpeed: { type: 'number', default: 0.5 },
        scaleStep: { type: 'number', default: 0.2 },
        minScale: { type: 'number', default: 0.5 },
        maxScale: { type: 'number', default: 8.0 }
      },
      init: function () {
        this.lastTouchX = 0;
        this.lastTouchY = 0;
        this.bindEvents();
      },
      bindEvents: function () {
        window.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) {
            this.lastTouchX = e.touches[0].clientX;
            this.lastTouchY = e.touches[0].clientY;
          }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
          if (e.touches.length === 1) {
            const deltaX = e.touches[0].clientX - this.lastTouchX;
            const deltaY = e.touches[0].clientY - this.lastTouchY;
            const rot = this.el.getAttribute('rotation');

            this.el.setAttribute('rotation', {
              x: rot.x + deltaY * this.data.rotateSpeed,
              y: rot.y + deltaX * this.data.rotateSpeed,
              z: rot.z
            });

            this.lastTouchX = e.touches[0].clientX;
            this.lastTouchY = e.touches[0].clientY;
          }
        }, { passive: true });
      },
      adjustScale: function (direction) {
        const currentScale = this.el.getAttribute('scale').x;
        let newScale = currentScale + (direction * this.data.scaleStep);
        newScale = Math.min(Math.max(newScale, this.data.minScale), this.data.maxScale);
        this.el.setAttribute('scale', { x: newScale, y: newScale, z: newScale });
      }
    });
  </script>
</head>
<body>

  <!-- Top Segmented Organ Bar -->
  <div class="organ-bar-container">
    <nav class="organ-bar" id="organSelector">
      <button class="organ-chip is-active" data-organ="liver" data-asset="#liverModel">Liver</button>
      <button class="organ-chip" data-organ="heart" data-asset="#heartModel">Heart</button>
      <button class="organ-chip" data-organ="lungs" data-asset="#lungModel">Lungs</button>
      <button class="organ-chip" data-organ="kidneys" data-asset="#kidneyModel">Kidneys</button>
      <button class="organ-chip" data-organ="stomach" data-asset="#stomachModel">Stomach</button>
    </nav>
  </div>

  <!-- Bottom Floating Control Surface -->
  <main class="viewport-overlay">
    <section class="surface-card">
      
      <!-- Lifestyle Toggles -->
      <div class="factor-group" id="factorGroup">
        <button class="factor-chip" data-factor="alcohol">🍺 Alcohol</button>
        <button class="factor-chip" data-factor="tobacco">🚬 Tobacco</button>
        <button class="factor-chip" data-factor="substance">💊 Opioids</button>
      </div>

      <!-- Timeline & Zoom Controls -->
      <div class="timeline-control">
        <div class="timeline-label-row">
          <span>Exposure Timeline</span>
          <span id="yearDisplay">1 Year</span>
        </div>
        <div class="timeline-slider-wrapper">
          <input type="range" id="exposureSlider" min="1" max="20" value="1">
          <div class="zoom-btn-group">
            <button class="icon-button" id="zoomOutBtn" aria-label="Zoom Out">−</button>
            <button class="icon-button" id="zoomInBtn" aria-label="Zoom In">+</button>
          </div>
        </div>
      </div>

      <!-- Organ Status Info -->
      <div class="info-header">
        <span class="info-title" id="organTitle">LIVER — Anatomy View</span>
        <span class="status-badge" id="efficiencyBadge">Efficiency 100%</span>
      </div>
      <p class="info-description" id="organDescription">
        Scan a flashcard to inspect anatomical structures in WebAR.
      </p>

    </section>
  </main>

  <!-- AR Canvas Scene using Single Unified organs.mind Target File -->
  <a-scene 
    mindar-image="imageTargetSrc: ./organs.mind; autoStart: true;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <a-asset-item id="liverModel" src="./assets/models/liver.glb"></a-asset-item>
      <a-asset-item id="heartModel" src="./assets/models/heart.glb"></a-asset-item>
      <a-asset-item id="lungModel" src="./assets/models/lung.glb"></a-asset-item>
      <a-asset-item id="kidneyModel" src="./assets/models/kidney.glb"></a-asset-item>
      <a-asset-item id="stomachModel" src="./assets/models/stomach.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Studio Lighting -->
    <a-light type="ambient" intensity="1.6"></a-light>
    <a-light type="directional" position="1 2 3" intensity="2.2"></a-light>

    <!-- LIVER TARGETS (Indices 0 - 8) -->
    <a-entity mindar-image-target="targetIndex: 0" id="liver-target-0">
      <a-gltf-model class="ar-model" data-organ="liver" src="#liverModel" position="0 0 0.2" scale="2.5 2.5 2.5" rotation="0 0 0" viewport-gestures></a-gltf-model>
    </a-entity>

    <!-- HEART TARGETS (Indices 9 - 17) -->
    <a-entity mindar-image-target="targetIndex: 9" id="heart-target-0">
      <a-gltf-model class="ar-model" data-organ="heart" src="#heartModel" position="0 0 0.2" scale="2.5 2.5 2.5" rotation="0 0 0" viewport-gestures></a-gltf-model>
    </a-entity>

    <!-- LUNGS TARGETS (Indices 18 - 26) -->
    <a-entity mindar-image-target="targetIndex: 18" id="lung-target-0">
      <a-gltf-model class="ar-model" data-organ="lungs" src="#lungModel" position="0 0 0.2" scale="2.5 2.5 2.5" rotation="0 0 0" viewport-gestures></a-gltf-model>
    </a-entity>

    <!-- KIDNEYS TARGETS (Indices 27 - 35) -->
    <a-entity mindar-image-target="targetIndex: 27" id="kidney-target-0">
      <a-gltf-model class="ar-model" data-organ="kidneys" src="#kidneyModel" position="0 0 0.2" scale="2.5 2.5 2.5" rotation="0 0 0" viewport-gestures></a-gltf-model>
    </a-entity>

    <!-- STOMACH TARGETS (Indices 36 - 44) -->
    <a-entity mindar-image-target="targetIndex: 36" id="stomach-target-0">
      <a-gltf-model class="ar-model" data-organ="stomach" src="#stomachModel" position="0 0 0.2" scale="2.5 2.5 2.5" rotation="0 0 0" viewport-gestures></a-gltf-model>
    </a-entity>

  </a-scene>

  <!-- Application Logic -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const AppState = {
        selectedOrgan: "liver",
        selectedAsset: "#liverModel",
        years: 1,
        factors: {
          alcohol: false,
          tobacco: false,
          substance: false
        }
      };

      const OrganDescriptions = {
        liver: "Filters toxins and aids metabolism. Prolonged exposure causes hepatic inflammation and fibrotic tissue scarring.",
        heart: "Cardiovascular center. Substance strain increases arterial stiffness, causing myocardial hypertrophy.",
        lungs: "Facilitates gas exchange. Smoke toxins destroy pulmonary alveoli, reducing overall vital lung capacity.",
        kidneys: "Renal filtration system. Chronic toxin exposure causes glomerulosclerosis and reduced renal filtration.",
        stomach: "Gastrointestinal organ. Heavy alcohol and opioid use irritates mucosal lining, causing ulcers."
      };

      const organTitle = document.getElementById("organTitle");
      const organDescription = document.getElementById("organDescription");
      const efficiencyBadge = document.getElementById("efficiencyBadge");
      const yearDisplay = document.getElementById("yearDisplay");
      const exposureSlider = document.getElementById("exposureSlider");

      const render = () => {
        let activeFactorCount = Object.values(AppState.factors).filter(Boolean).length;
        let healthValue = Math.max(12, 100 - (AppState.years * activeFactorCount * 2.2));

        organTitle.innerText = `${AppState.selectedOrgan.toUpperCase()} — Pathology View`;
        yearDisplay.innerText = `${AppState.years} Year${AppState.years > 1 ? 's' : ''}`;
        efficiencyBadge.innerText = `Efficiency ${Math.round(healthValue)}%`;

        if (healthValue < 65) {
          efficiencyBadge.classList.add("is-warning");
        } else {
          efficiencyBadge.classList.remove("is-warning");
        }

        if (activeFactorCount > 0) {
          organDescription.innerText = `Impact after ${AppState.years} year(s): ${OrganDescriptions[AppState.selectedOrgan]}`;
        } else {
          organDescription.innerText = "Select lifestyle factors above to simulate structural changes over time.";
        }

        // High-Contrast Shader & Material Transformation Engine
        document.querySelectorAll(".ar-model").forEach((modelEl) => {
          const mesh = modelEl.getObject3D('mesh');
          if (!mesh) return;

          mesh.traverse((node) => {
            if (node.isMesh && node.material) {
              let color = new THREE.Color(0xffffff);
              let roughness = 0.4;

              if (activeFactorCount > 0) {
                const yearRatio = AppState.years / 20.0; // 0.05 to 1.0

                // 1. Alcohol Impact: Fatty Steatosis / Inflammatory Crimson
                if (AppState.factors.alcohol && !AppState.factors.tobacco && !AppState.factors.substance) {
                  color.lerp(new THREE.Color(0xd97706), yearRatio * 0.85); // Vibrant Yellow-Orange
                  roughness = 0.2; // Greasy sheen
                }

                // 2. Tobacco Impact: Carbon Deposition & Severe Hypoxia
                else if (AppState.factors.tobacco && !AppState.factors.alcohol && !AppState.factors.substance) {
                  color.lerp(new THREE.Color(0x1e293b), yearRatio * 0.90); // Dark Slate Black
                  roughness = 0.85; // Dry rough surface
                }

                // 3. Opioid Impact: Deep Ischemic Purple
                else if (AppState.factors.substance && !AppState.factors.alcohol && !AppState.factors.tobacco) {
                  color.lerp(new THREE.Color(0x581c87), yearRatio * 0.88); // Deep Purple
                  roughness = 0.6;
                }

                // 4. Combined Multi-Factor Impact: Severe Necrosis
                else {
                  color.lerp(new THREE.Color(0x270707), yearRatio * 0.95); // Necrotic Dark Red-Black
                  roughness = 0.95;
                }

                // Apply progressive darkening over time
                color.multiplyScalar(1.0 - (yearRatio * 0.45));
              }

              node.material.color = color;
              node.material.roughness = roughness;
              node.material.needsUpdate = true;
            }
          });
        });
      };

      // Top Tab Manual Selection
      document.getElementById("organSelector").addEventListener("click", (e) => {
        const chip = e.target.closest(".organ-chip");
        if (!chip) return;

        document.querySelectorAll(".organ-chip").forEach(c => c.classList.remove("is-active"));
        chip.classList.add("is-active");

        AppState.selectedOrgan = chip.dataset.organ;
        AppState.selectedAsset = chip.dataset.asset;

        render();
      });

      // Target Scanning Event Handler
      document.querySelectorAll("[mindar-image-target]").forEach((targetEl) => {
        targetEl.addEventListener("targetFound", () => {
          const modelEl = targetEl.querySelector(".ar-model");
          if (modelEl && modelEl.dataset.organ) {
            AppState.selectedOrgan = modelEl.dataset.organ;
            
            document.querySelectorAll(".organ-chip").forEach((chip) => {
              chip.classList.toggle("is-active", chip.dataset.organ === AppState.selectedOrgan);
            });

            render();
          }
        });
      });

      // Factor Toggles
      document.getElementById("factorGroup").addEventListener("click", (e) => {
        const chip = e.target.closest(".factor-chip");
        if (!chip) return;

        const factor = chip.dataset.factor;
        AppState.factors[factor] = !AppState.factors[factor];
        chip.classList.toggle("is-active", AppState.factors[factor]);

        render();
      });

      // Exposure Duration Slider
      exposureSlider.addEventListener("input", (e) => {
        AppState.years = parseInt(e.target.value, 10);
        render();
      });

      // Zoom Controls
      document.getElementById("zoomInBtn").addEventListener("click", () => {
        document.querySelectorAll(".ar-model").forEach(el => {
          el.components['viewport-gestures']?.adjustScale(1);
        });
      });

      document.getElementById("zoomOutBtn").addEventListener("click", () => {
        document.querySelectorAll(".ar-model").forEach(el => {
          el.components['viewport-gestures']?.adjustScale(-1);
        });
      });
    });
  </script>
</body>
</html>
