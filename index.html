<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neuroanatomy WebAR Flashcards</title>

  <!-- A-Frame and MindAR Libraries -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Loading Overlay */
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Dynamic UI Notification Label */
    #ui-card-label {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      color: #38bdf8;
      padding: 12px 24px;
      border-radius: 24px;
      font-weight: 600;
      font-size: 0.95rem;
      border: 1px solid rgba(56, 189, 248, 0.3);
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      z-index: 1000;
      display: none;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <div>Loading Neuroanatomy AR...</div>
  </div>

  <!-- Dynamic Active Card Badge -->
  <div id="ui-card-label">Scanning target...</div>

  <!-- A-Frame AR Scene -->
  <a-scene 
    mindar-image="imageTargetSrc: ./targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <!-- Preload 3D Model Assets -->
    <a-assets>
      <a-asset-item id="limbicModel" src="./limbic_system.glb"></a-asset-item>
      <a-asset-item id="neuronModel" src="./neuron.glb"></a-asset-item>
      <a-asset-item id="brainstemModel" src="./brainstem.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- TARGET 0: First image in targets.mind -->
    <a-entity mindar-image-target="targetIndex: 0" id="target-0">
      <a-gltf-model src="#limbicModel" position="0 0 0" scale="0.2 0.2 0.2" rotation="0 0 0"></a-gltf-model>
    </a-entity>

    <!-- TARGET 1: Second image in targets.mind -->
    <a-entity mindar-image-target="targetIndex: 1" id="target-1">
      <a-gltf-model src="#neuronModel" position="0 0 0" scale="0.2 0.2 0.2" rotation="0 0 0"></a-gltf-model>
    </a-entity>

    <!-- TARGET 2: Third image in targets.mind -->
    <a-entity mindar-image-target="targetIndex: 2" id="target-2">
      <a-gltf-model src="#brainstemModel" position="0 0 0" scale="0.2 0.2 0.2" rotation="0 0 0"></a-gltf-model>
    </a-entity>

  </a-scene>

  <!-- Interactive Logic & Event Handling -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const sceneEl = document.querySelector("a-scene");
      const loadingScreen = document.getElementById("loading-screen");
      const uiLabel = document.getElementById("ui-card-label");

      // Hide loading overlay when scene is fully mounted
      sceneEl.addEventListener("loaded", () => {
        loadingScreen.style.opacity = "0";
        setTimeout(() => {
          loadingScreen.style.display = "none";
        }, 500);
      });

      // Target Names mapped to targetIndex order
      const targetDetails = {
        "target-0": "Limbic System Detected",
        "target-1": "Neuron / Synapse Detected",
        "target-2": "Brain Stem Detected"
      };

      // Listen for target detection events
      const targets = document.querySelectorAll("[mindar-image-target]");
      targets.forEach((target) => {
        target.addEventListener("targetFound", (event) => {
          const targetId = event.target.id;
          uiLabel.innerText = targetDetails[targetId] || "Card Detected";
          uiLabel.style.display = "block";
        });

        target.addEventListener("targetLost", () => {
          uiLabel.style.display = "none";
        });
      });
    });
  </script>

</body>
</html>
