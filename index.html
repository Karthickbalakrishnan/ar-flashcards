<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

  <!-- Loading Screen Overlay -->
  <div id="loading" style="position: fixed; z-index: 999; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; color: #fff; display: flex; align-items: center; justify-content: center;">
    Loading AR Experience...
  </div>

  <!-- A-Frame Scene configured with your mind target file -->
  <a-scene mindar-image="imageTargetSrc: ./targets.mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    
    <!-- Preload your 3D Models (.glb) -->
    <a-assets>
      <a-asset-item id="limbicModel" src="./limbic_system.glb"></a-asset-item>
      <a-asset-item id="neuronModel" src="./neuron.glb"></a-asset-item>
      <a-asset-item id="brainstemModel" src="./brainstem.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- TARGET 0: First image uploaded -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model src="#limbicModel" position="0 0 0" scale="0.2 0.2 0.2" rotation="0 0 0"></a-gltf-model>
    </a-entity>

    <!-- TARGET 1: Second image uploaded -->
    <a-entity mindar-image-target="targetIndex: 1">
      <a-gltf-model src="#neuronModel" position="0 0 0" scale="0.2 0.2 0.2" rotation="0 0 0"></a-gltf-model>
    </a-entity>

    <!-- TARGET 2: Third image uploaded -->
    <a-entity mindar-image-target="targetIndex: 2">
      <a-gltf-model src="#brainstemModel" position="0 0 0" scale="0.2 0.2 0.2" rotation="0 0 0"></a-gltf-model>
    </a-entity>

  </a-scene>

  <!-- Existing Loading Script -->
  <script>
    const scene = document.querySelector("a-scene");
    scene.addEventListener("loaded", () => {
      document.getElementById("loading").style.display = "none";
    });
  </script>

</body>
</html>
