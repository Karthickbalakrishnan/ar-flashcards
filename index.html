<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>OrganoAR Education Suite — Real-time WebAR Engine</title>

  <!-- Stable WebAR Core Libraries -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    :root {
      --sys-surface: rgba(15, 23, 42, 0.90);
      --sys-surface-glass: rgba(15, 23, 42, 0.85);
      --sys-border: rgba(255, 255, 255, 0.12);
      --sys-primary: #38bdf8;
      --sys-danger: #fb7185;
      --sys-warning: #facc15;
      --sys-success: #4ade80;
      --sys-text: #f8fafc;
      --sys-subtext: #94a3b8;
      --radius-sheet: 28px;
      --radius-pill: 9999px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: transparent !important;
      color: var(--sys-text);
    }

    a-scene, .a-canvas {
      position: absolute !important;
      inset: 0 !important;
      z-index: 1 !important;
      background-color: transparent !important;
      background: transparent !important;
    }

    video {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      z-index: 0 !important;
    }

    #welcomeGate {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: radial-gradient(circle at 50% 30%, #1e293b, #020617);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .welcome-card {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--sys-border);
      border-radius: 32px;
      padding: 36px 28px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 32px 64px -16px rgba(0, 0, 0, 0.6);
    }

    .scholar-meta {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .scholar-name { font-size: 1.125rem; font-weight: 700; color: var(--sys-text); }
    .scholar-title { font-size: 0.8125rem; color: var(--sys-primary); font-weight: 600; }

    .welcome-title { font-size: 1.5rem; font-weight: 700; margin: 0 0 8px 0; }
    .welcome-desc { font-size: 0.875rem; color: var(--sys-subtext); margin: 0 0 28px 0; line-height: 1.5; }

    .btn-start {
      width: 100%;
      padding: 16px;
      background: var(--sys-primary);
      border: none;
      border-radius: 16px;
      color: #020617;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .btn-start:active { transform: scale(0.98); }

    #ar-ui-container {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }

    #ar-ui-container > * { pointer-events: auto; }

    .ar-top-bar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--sys-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--sys-border);
      padding: 10px 16px;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }

    .ar-top-row { display: flex; justify-content: space-between; align-items: center; }
    .organ-badge { display: flex; align-items: center; gap: 10px; }
    #active-organ-title { font-size: 0.9375rem; font-weight: 700; color: var(--sys-text); }

    .chip {
      font-size: 0.6875rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      text-transform: uppercase;
    }
    .chip.green { background: rgba(74, 222, 128, 0.15); color: var(--sys-success); border: 1px solid rgba(74, 222, 128, 0.3); }
    .chip.yellow { background: rgba(250, 204, 21, 0.15); color: var(--sys-warning); border: 1px solid rgba(250, 204, 21, 0.3); }
    .chip.red { background: rgba(251, 113, 133, 0.15); color: var(--sys-danger); border: 1px solid rgba(251, 113, 133, 0.3); }

    .manual-selector-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-top: 4px;
      scrollbar-width: none;
    }
    .manual-selector-bar::-webkit-scrollbar { display: none; }

    .manual-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--sys-border);
      color: var(--sys-subtext);
      font-size: 0.6875rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      white-space: nowrap;
    }
    .manual-pill.is-active {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--sys-primary);
      color: var(--sys-text);
    }

    .bottom-sheet {
      background: var(--sys-surface-glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--sys-border);
      border-radius: var(--radius-sheet);
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.6);
      pointer-events: auto !important;
    }

    .sheet-handle-bar {
      padding: 14px 20px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .drag-indicator { width: 36px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.25); }
    .summary-line { display: flex; justify-content: space-between; width: 100%; align-items: center; font-size: 0.8125rem; font-weight: 600; color: var(--sys-subtext); }

    .bottom-sheet.collapsed .sheet-content { display: none; }

    .sheet-content {
      padding: 0 20px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .chip-group { display: flex; gap: 8px; }
    .chip-toggle {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--sys-border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--sys-subtext);
      font-size: 0.78125rem;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
    }
    .chip-toggle.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--sys-primary);
      color: var(--sys-text);
      font-weight: 600;
    }

    input[type=range] { width: 100%; accent-color: var(--sys-primary); }
    .symptom-card { background: rgba(0, 0, 0, 0.3); border: 1px solid var(--sys-border); border-radius: 14px; padding: 12px; }
    #symptom-list { margin: 0; padding-left: 16px; font-size: 0.78125rem; color: var(--sys-text); }
  </style>

  <script>
    const ORGAN_DATA = {
      BRAIN: { name: "Brain", substances: ["alcohol", "smoking", "narcotics"] },
      KIDNEYS: { name: "Kidneys", substances: ["alcohol", "narcotics", "smoking"] },
      LUNGS: { name: "Lungs", substances: ["smoking", "narcotics", "alcohol"] },
      HEART: { name: "Heart", substances: ["alcohol", "smoking", "narcotics"] },
      LIVER: { name: "Liver", substances: ["alcohol", "narcotics", "smoking"] },
      STOMACH: { name: "Stomach", substances: ["alcohol", "smoking", "narcotics"] },
      EYES: { name: "Eyes", substances: ["narcotics", "alcohol", "smoking"] }
    };

    const TARGET_MAP = { 0: "BRAIN", 1: "KIDNEYS", 2: "LUNGS", 3: "HEART", 4: "LIVER", 5: "STOMACH", 6: "EYES" };

    const AppState = { activeKey: "HEART", activeSubstances: new Set(["alcohol"]), years: 1 };

    function startApp() {
      document.getElementById("welcomeGate").style.display = "none";
      const sceneEl = document.querySelector("a-scene");
      const arSystem = sceneEl.systems["mindar-image-system"];
      if (arSystem) arSystem.start();
      
      // Default initial activation to Heart for instant target testing
      activateOrgan(3);
    }

    function activateOrgan(targetIndex) {
      const organKey = TARGET_MAP[targetIndex];
      if (!organKey) return;

      AppState.activeKey = organKey;

      for (let i = 0; i <= 6; i++) {
        const node = document.getElementById(`arTargetNode${i}`);
        if (node) {
          node.object3D.visible = (i === targetIndex);
        }
      }

      document.getElementById("active-organ-title").innerText = organKey;
      document.getElementById("ar-ui-container").style.display = "flex";

      const pills = document.querySelectorAll('.manual-pill');
      pills.forEach((pill, idx) => {
        if (idx === targetIndex) pill.classList.add('is-active');
        else pill.classList.remove('is-active');
      });
    }

    function toggleSheet() {
      document.getElementById("bottom-sheet").classList.toggle("collapsed");
    }
  </script>
</head>
<body>

  <div id="welcomeGate">
    <div class="welcome-card">
      <div class="scholar-meta">
        <span class="scholar-name">OrganoAR Education Suite</span>
        <span class="scholar-title">Substance Pathology Visualizer</span>
      </div>
      <p class="welcome-desc">Scan target card or select an organ to visualize 3D degradation.</p>
      <button class="btn-start" onclick="startApp()">Start AR Camera</button>
    </div>
  </div>

  <div id="ar-ui-container">
    <header class="ar-top-bar">
      <div class="ar-top-row">
        <div class="organ-badge">
          <span id="active-organ-title">HEART</span>
          <span id="active-health-chip" class="chip green">100% HEALTH</span>
        </div>
      </div>
      <div class="manual-selector-bar">
        <button class="manual-pill" onclick="activateOrgan(0)">Brain</button>
        <button class="manual-pill" onclick="activateOrgan(1)">Kidneys</button>
        <button class="manual-pill" onclick="activateOrgan(2)">Lungs</button>
        <button class="manual-pill is-active" onclick="activateOrgan(3)">Heart</button>
        <button class="manual-pill" onclick="activateOrgan(4)">Liver</button>
        <button class="manual-pill" onclick="activateOrgan(5)">Stomach</button>
        <button class="manual-pill" onclick="activateOrgan(6)">Eyes</button>
      </div>
    </header>

    <div id="bottom-sheet" class="bottom-sheet collapsed">
      <div class="sheet-handle-bar" onclick="toggleSheet()">
        <div class="drag-indicator"></div>
        <div class="summary-line">
          <span>1 Year Exposure</span>
          <span>▲ Expand</span>
        </div>
      </div>
      <div class="sheet-content">
        <div class="control-group">
          <div class="chip-group">
            <button class="chip-toggle active">🍺 Alcohol</button>
            <button class="chip-toggle">💊 Narcotics</button>
            <button class="chip-toggle">🚬 Smoking</button>
          </div>
        </div>
        <input type="range" min="1" max="20" value="1">
        <div class="symptom-card">
          <ul id="symptom-list">
            <li>Episodic resting heart rate elevation</li>
            <li>Transient blood pressure spikes</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/examples/image-tracking/assets/card-example/card.mind; autoStart: false; uiScanning: no;" 
    embedded 
    renderer="colorManagement: true; alpha: true; transparent: true;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-light type="ambient" intensity="1.5"></a-light>
    <a-light type="directional" position="1 2 3" intensity="2.0"></a-light>

    <!-- Target Node 3: Heart with instant WebGL procedural fallback mesh -->
    <a-entity mindar-image-target="targetIndex: 0" id="arTargetNode0">
      <a-sphere radius="0.3" color="#38bdf8"></a-sphere>
    </a-entity>
    <a-entity mindar-image-target="targetIndex: 1" id="arTargetNode1">
      <a-sphere radius="0.3" color="#facc15"></a-sphere>
    </a-entity>
    <a-entity mindar-image-target="targetIndex: 2" id="arTargetNode2">
      <a-sphere radius="0.3" color="#4ade80"></a-sphere>
    </a-entity>
    
    <!-- Heart Node Target Index 3 -->
    <a-entity mindar-image-target="targetIndex: 3" id="arTargetNode3">
      <!-- 3D Heart Geometry Fallback Mesh -->
      <a-entity id="heart3DMesh" position="0 0 0" rotation="0 0 0">
        <a-octahedron radius="0.35" color="#ef4444" animation="property: scale; to: 1.1 1.1 1.1; dir: alternate; dur: 800; loop: true"></a-octahedron>
        <a-cylinder radius="0.08" height="0.4" color="#cbd5e1" position="0 0.25 0"></a-cylinder>
      </a-entity>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 4" id="arTargetNode4">
      <a-sphere radius="0.3" color="#fb923c"></a-sphere>
    </a-entity>
    <a-entity mindar-image-target="targetIndex: 5" id="arTargetNode5">
      <a-sphere radius="0.3" color="#a855f7"></a-sphere>
    </a-entity>
    <a-entity mindar-image-target="targetIndex: 6" id="arTargetNode6">
      <a-sphere radius="0.3" color="#ec4899"></a-sphere>
    </a-entity>
  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      for (let i = 0; i <= 6; i++) {
        const node = document.getElementById(`arTargetNode${i}`);
        if (node) {
          node.addEventListener("targetFound", () => activateOrgan(i));
        }
      }
    });
  </script>
</body>
</html>
