<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OrganoAR — Camera-First Pathology Engine</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    :root {
      --bg-glass: rgba(15, 23, 42, 0.85);
      --border-glass: rgba(255, 255, 255, 0.12);
      --accent: #38bdf8;
      --danger: #f43f5e;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

    body {
      margin: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #020617;
      color: var(--text);
    }

    /* Minimalist HUD Overlay */
    .viewport-overlay {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      width: calc(100% - 32px);
      max-width: 400px;
    }

    .surface-card {
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      padding: 14px 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .organ-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .organ-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .status-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
    }

    .status-badge.is-warning {
      background: rgba(244, 63, 94, 0.15);
      color: var(--danger);
    }

    /* Factor Toggles */
    .factor-group { display: flex; gap: 6px; }

    .factor-chip {
      flex: 1;
      padding: 8px 6px;
      border: 1px solid var(--border-glass);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .factor-chip.is-active {
      background: rgba(244, 63, 94, 0.2);
      border-color: var(--danger);
      color: var(--danger);
    }

    /* Timeline Slider */
    .timeline-control { display: flex; flex-direction: column; gap: 4px; }

    .timeline-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    input[type=range] {
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.15);
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* Scan Prompt */
    #scanPrompt {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-glass);
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 0.8rem;
      color: var(--text-muted);
      z-index: 100;
      pointer-events: none;
    }
  </style>

  <script>
    // Touch Rotation & Zoom Component
    AFRAME.registerComponent('viewport-gestures', {
      schema: { rotateSpeed: { type: 'number', default: 0.5 } },
      init: function () {
        this.lastTouchX = 0;
        this.lastTouchY = 0;
        window.addEventListener('touchstart', (e) => {
          if (e.touches.length === 1) {
            this.lastTouchX = e.touches[0].clientX;
            this.lastTouchY = e.touches[0].clientY;
          }
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
          if (e.touches.length === 1) {
            const deltaX = e.touches[0].clientX - this.lastTouchX;
            const deltaY = e.touches[0].clientY - this.lastTouchY;
            const rot = this.el.getAttribute('rotation');

            this.el.setAttribute('rotation', {
              x: rot.x + deltaY * this.data.rotateSpeed,
              y: rot.y + deltaX * this.data.rotateSpeed,
              z: rot.z
            });

            this.lastTouchX = e.touches[0].clientX;
            this.lastTouchY = e.touches[0].clientY;
          }
        }, { passive: true });
      }
    });
  </script>
</head>
<body>

  <div id="scanPrompt">📷 Point camera at any organ card</div>

  <main class="viewport-overlay">
    <section class="surface-card">
      <div class="organ-header">
        <span class="organ-title" id="organTitle">SCANNING...</span>
        <span class="status-badge" id="efficiencyBadge">Efficiency 100%</span>
      </div>

      <div class="factor-group" id="factorGroup">
        <button class="factor-chip" data-factor="alcohol">🍺 Alcohol</button>
        <button class="factor-chip" data-factor="tobacco">🚬 Tobacco</button>
        <button class="factor-chip" data-factor="substance">💊 Opioids</button>
      </div>

      <div class="timeline-control">
        <div class="timeline-label-row">
          <span>Exposure Duration</span>
          <span id="yearDisplay">1 Year</span>
        </div>
        <input type="range" id="exposureSlider" min="1" max="20" value="1">
      </div>
    </section>
  </main>

  <a-scene 
    mindar-image="imageTargetSrc: ./assets/targets/organs.mind; autoStart: true;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights: true" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <a-asset-item id="liverModel" src="./assets/models/liver.glb"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-light type="ambient" intensity="1.6"></a-light>
    <a-light type="directional" position="1 2 3" intensity="2.2"></a-light>

    <a-entity mindar-image-target="targetIndex: 0" id="target-liver">
      <a-gltf-model class="ar-model" data-organ="LIVER" src="#liverModel" position="0 0 0.2" scale="2.5 2.5 2.5" viewport-gestures></a-gltf-model>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 9" id="target-heart">
      <a-gltf-model class="ar-model" data-organ="HEART" position="0 0 0.2" scale="2.5 2.5 2.5" viewport-gestures></a-gltf-model>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 18" id="target-lungs">
      <a-gltf-model class="ar-model" data-organ="LUNGS" position="0 0 0.2" scale="2.5 2.5 2.5" viewport-gestures></a-gltf-model>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 27" id="target-kidneys">
      <a-gltf-model class="ar-model" data-organ="KIDNEYS" position="0 0 0.2" scale="2.5 2.5 2.5" viewport-gestures></a-gltf-model>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 36" id="target-stomach">
      <a-gltf-model class="ar-model" data-organ="STOMACH" position="0 0 0.2" scale="2.5 2.5 2.5" viewport-gestures></a-gltf-model>
    </a-entity>

  </a-scene>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const AppState = {
        activeOrgan: "LIVER",
        years: 1,
        factors: { alcohol: false, tobacco: false, substance: false }
      };

      const ModelPaths = {
        HEART: "./assets/models/heart.glb",
        LUNGS: "./assets/models/lung.glb",
        KIDNEYS: "./assets/models/kidney.glb",
        STOMACH: "./assets/models/stomach.glb"
      };

      const organTitle = document.getElementById("organTitle");
      const efficiencyBadge = document.getElementById("efficiencyBadge");
      const yearDisplay = document.getElementById("yearDisplay");
      const exposureSlider = document.getElementById("exposureSlider");
      const scanPrompt = document.getElementById("scanPrompt");

      // Lazy model loader on target detection
      const ensureModelLoaded = (targetEntity, organName) => {
        const modelEl = targetEntity.querySelector(".ar-model");
        if (modelEl && !modelEl.getAttribute("src") && ModelPaths[organName]) {
          modelEl.setAttribute("src", ModelPaths[organName]);
        }
      };

      const render = () => {
        let activeFactorCount = Object.values(AppState.factors).filter(Boolean).length;
        let healthValue = Math.max(12, 100 - (AppState.years * activeFactorCount * 2.2));

        organTitle.innerText = `${AppState.activeOrgan} PATHOLOGY`;
        yearDisplay.innerText = `${AppState.years} Year${AppState.years > 1 ? 's' : ''}`;
        efficiencyBadge.innerText = `Efficiency ${Math.round(healthValue)}%`;

        if (healthValue < 65) {
          efficiencyBadge.classList.add("is-warning");
        } else {
          efficiencyBadge.classList.remove("is-warning");
        }

        // Material & Mesh Distortion
        document.querySelectorAll(".ar-model").forEach((modelEl) => {
          const mesh = modelEl.getObject3D('mesh');
          if (!mesh) return;

          const yearRatio = AppState.years / 20.0;
          let shrinkScale = 2.5 - (yearRatio * 0.4 * activeFactorCount);
          modelEl.setAttribute("scale", `${shrinkScale} ${shrinkScale} ${shrinkScale}`);

          mesh.traverse((node) => {
            if (node.isMesh && node.material) {
              let color = new THREE.Color(0xffffff);
              let roughness = 0.4;

              if (activeFactorCount > 0) {
                if (AppState.factors.alcohol && !AppState.factors.tobacco && !AppState.factors.substance) {
                  color.lerp(new THREE.Color(0xd97706), yearRatio * 0.85); // Fatty Liver Yellow
                  roughness = 0.2;
                } else if (AppState.factors.tobacco && !AppState.factors.alcohol && !AppState.factors.substance) {
                  color.lerp(new THREE.Color(0x1e293b), yearRatio * 0.90); // Charcoal Black
                  roughness = 0.85;
                } else if (AppState.factors.substance && !AppState.factors.alcohol && !AppState.factors.tobacco) {
                  color.lerp(new THREE.Color(0x581c87), yearRatio * 0.88); // Purple Ischemia
                  roughness = 0.6;
                } else {
                  color.lerp(new THREE.Color(0x270707), yearRatio * 0.95); // Necrosis
                  roughness = 0.95;
                }
                color.multiplyScalar(1.0 - (yearRatio * 0.45));
              }

              node.material.color = color;
              node.material.roughness = roughness;
              node.material.needsUpdate = true;
            }
          });
        });
      };

      // Automatic Camera Detection Handlers
      document.querySelectorAll("[mindar-image-target]").forEach((targetEl) => {
        targetEl.addEventListener("targetFound", () => {
          const modelEl = targetEl.querySelector(".ar-model");
          if (modelEl) {
            AppState.activeOrgan = modelEl.dataset.organ;
            ensureModelLoaded(targetEl, AppState.activeOrgan);
            scanPrompt.style.display = "none";
            render();
          }
        });

        targetEl.addEventListener("targetLost", () => {
          scanPrompt.style.display = "block";
        });
      });

      // Factor Toggles
      document.getElementById("factorGroup").addEventListener("click", (e) => {
        const chip = e.target.closest(".factor-chip");
        if (!chip) return;

        const factor = chip.dataset.factor;
        AppState.factors[factor] = !AppState.factors[factor];
        chip.classList.toggle("is-active", AppState.factors[factor]);
        render();
      });

      // Slider
      exposureSlider.addEventListener("input", (e) => {
        AppState.years = parseInt(e.target.value, 10);
        render();
      });
    });
  </script>
</body>
</html>
