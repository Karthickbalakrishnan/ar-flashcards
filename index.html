<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>OrganoAR Education Suite — Real-time WebAR Engine</title>

  <!-- Stable WebAR Core Libraries -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    :root {
      --sys-surface: rgba(15, 23, 42, 0.90);
      --sys-surface-glass: rgba(15, 23, 42, 0.85);
      --sys-border: rgba(255, 255, 255, 0.12);
      --sys-primary: #38bdf8;
      --sys-danger: #fb7185;
      --sys-warning: #facc15;
      --sys-success: #4ade80;
      --sys-text: #f8fafc;
      --sys-subtext: #94a3b8;
      --radius-sheet: 28px;
      --radius-pill: 9999px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: transparent !important;
      color: var(--sys-text);
    }

    a-scene, .a-canvas {
      position: absolute !important;
      inset: 0 !important;
      z-index: 1 !important;
      background-color: transparent !important;
      background: transparent !important;
    }

    video {
      position: absolute !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      z-index: 0 !important;
    }

    #welcomeGate {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: radial-gradient(circle at 50% 30%, #1e293b, #020617);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .welcome-card {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--sys-border);
      border-radius: 32px;
      padding: 36px 28px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 32px 64px -16px rgba(0, 0, 0, 0.6);
    }

    .scholar-meta {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .scholar-name { font-size: 1.125rem; font-weight: 700; color: var(--sys-text); }
    .scholar-title { font-size: 0.8125rem; color: var(--sys-primary); font-weight: 600; }

    .welcome-title { font-size: 1.5rem; font-weight: 700; margin: 0 0 8px 0; }
    .welcome-desc { font-size: 0.875rem; color: var(--sys-subtext); margin: 0 0 28px 0; line-height: 1.5; }

    .btn-start {
      width: 100%;
      padding: 16px;
      background: var(--sys-primary);
      border: none;
      border-radius: 16px;
      color: #020617;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .btn-start:active { transform: scale(0.98); }

    #ar-ui-container {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none; /* shown when a target is found */
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      pointer-events: auto;
    }

    .ar-top-bar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--sys-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--sys-border);
      padding: 10px 16px;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ar-top-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .organ-badge { display: flex; align-items: center; gap: 10px; }
    #active-organ-title { font-size: 0.9375rem; font-weight: 700; color: var(--sys-text); }

    #organ-icon { font-size: 1.4rem; display: inline-flex; width: 40px; height: 40px; align-items: center; justify-content: center; background: rgba(255,255,255,0.03); border-radius: 10px; }

    .chip {
      font-size: 0.6875rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: var(--radius-pill);
      text-transform: uppercase;
    }

    .bottom-sheet {
      background: var(--sys-surface-glass);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--sys-border);
      border-radius: var(--radius-sheet);
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.6);
      pointer-events: auto !important;
      transition: transform 260ms cubic-bezier(.22,.9,.34,1);
    }

    .sheet-handle-bar {
      padding: 14px 20px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .drag-indicator { width: 36px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.25); }
    .summary-line { display: flex; justify-content: space-between; width: 100%; align-items: center; font-size: 0.8125rem; font-weight: 600; color: var(--sys-subtext); }

    .bottom-sheet.collapsed { transform: translateY(56%); }

    .sheet-content {
      padding: 0 20px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .chip-group { display: flex; gap: 8px; }
    .chip-toggle {
      flex: 1;
      padding: 8px;
      border: 1px solid var(--sys-border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--sys-subtext);
      font-size: 0.78125rem;
      border-radius: 12px;
      cursor: pointer;
      text-align: center;
    }
    .chip-toggle.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--sys-primary);
      color: var(--sys-text);
      font-weight: 600;
    }

    input[type=range] { width: 100%; accent-color: var(--sys-primary); }
    .symptom-card { background: rgba(0, 0, 0, 0.3); border: 1px solid var(--sys-border); border-radius: 14px; padding: 12px; }
    #symptom-list { margin: 0; padding-left: 16px; font-size: 0.78125rem; color: var(--sys-text); }

    /* debug overlay */
    #debugOverlay {
      position: fixed;
      right: 12px;
      top: 12px;
      z-index: 1200;
      background: rgba(0,0,0,0.6);
      color: #fff;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 12px;
      pointer-events: none;
      max-width: 220px;
      backdrop-filter: blur(6px);
    }

    /* focus and accessibility */
    button:focus { outline: 3px solid rgba(56,189,248,0.18); outline-offset: 2px; }
  </style>

  <script>
    const ORGAN_DATA = {
      BRAIN: { name: "Brain", substances: ["alcohol", "smoking", "narcotics"], emoji: "🧠" },
      KIDNEYS: { name: "Kidneys", substances: ["alcohol", "narcotics", "smoking"], emoji: "🫀" },
      LUNGS: { name: "Lungs", substances: ["smoking", "narcotics", "alcohol"], emoji: "🫁" },
      HEART: { name: "Heart", substances: ["alcohol", "smoking", "narcotics"], emoji: "❤️" },
      LIVER: { name: "Liver", substances: ["alcohol", "narcotics", "smoking"], emoji: "🟤" },
      STOMACH: { name: "Stomach", substances: ["alcohol", "smoking", "narcotics"], emoji: "🍽️" },
      EYES: { name: "Eyes", substances: ["narcotics", "alcohol", "smoking"], emoji: "👁️" }
    };

    const TARGET_MAP = { 0: "BRAIN", 1: "KIDNEYS", 2: "LUNGS", 3: "HEART", 4: "LIVER", 5: "STOMACH", 6: "EYES" };

    const AppState = { activeKey: null, activeSubstances: new Set(["alcohol"]), years: 1 };

    function startApp() {
      document.getElementById("welcomeGate").style.display = "none";
      const sceneEl = document.querySelector("a-scene");
      // Start MindAR image-tracking system
      const arSystem = sceneEl.systems["mindar-image-system"];
      if (arSystem && typeof arSystem.start === 'function') {
        arSystem.start();
      }

      // Ensure UI is hidden until a target is found
      document.getElementById("ar-ui-container").style.display = "none";

      // show scanning debug UI
      const dbg = document.getElementById('debugOverlay');
      if (dbg) dbg.innerText = 'Scanning for targets...';
    }

    function activateOrgan(targetIndex) {
      const organKey = TARGET_MAP[targetIndex];
      if (!organKey) return;

      AppState.activeKey = organKey;

      // show only the matched AR node and hide others
      for (let i = 0; i <= 6; i++) {
        const node = document.getElementById(`arTargetNode${i}`);
        if (node && node.object3D) {
          node.object3D.visible = (i === targetIndex);
        }
      }

      // update top UI with organ name + emoji
      const titleEl = document.getElementById("active-organ-title");
      const iconEl = document.getElementById("organ-icon");
      titleEl.innerText = ORGAN_DATA[organKey].name || organKey;
      iconEl.innerText = ORGAN_DATA[organKey].emoji || "🔬";

      // show the UI overlay
      document.getElementById("ar-ui-container").style.display = "flex";

      // update health chip text (placeholder — you can compute actual health values)
      const healthChip = document.getElementById("active-health-chip");
      if (healthChip) healthChip.innerText = "100% HEALTH";

      // update debug overlay
      const dbg = document.getElementById('debugOverlay');
      if (dbg) dbg.innerText = `Detected: ${organKey} (index ${targetIndex})`;
      console.log(`[AR] targetFound index=${targetIndex} organ=${organKey}`);

      // visual flash on organ icon to indicate detection
      if (iconEl) {
        iconEl.style.transition = 'transform 220ms ease, box-shadow 220ms ease';
        iconEl.style.transform = 'scale(1.12)';
        iconEl.style.boxShadow = '0 6px 18px rgba(56,189,248,0.18)';
        setTimeout(() => {
          iconEl.style.transform = '';
          iconEl.style.boxShadow = '';
        }, 420);
      }
    }

    function deactivateAllNodes() {
      for (let i = 0; i <= 6; i++) {
        const node = document.getElementById(`arTargetNode${i}`);
        if (node && node.object3D) node.object3D.visible = false;
      }
      AppState.activeKey = null;
      document.getElementById("ar-ui-container").style.display = "none";

      const dbg = document.getElementById('debugOverlay');
      if (dbg) dbg.innerText = 'Scanning for targets...';
    }

    function toggleSheet() {
      document.getElementById("bottom-sheet").classList.toggle("collapsed");
    }

    // Utility — called once DOM is ready to wire events
    document.addEventListener("DOMContentLoaded", () => {
      // add debug overlay element (keeps visible even if we update file later)
      let dbg = document.getElementById('debugOverlay');
      if (!dbg) {
        dbg = document.createElement('div');
        dbg.id = 'debugOverlay';
        dbg.innerText = 'Idle';
        document.body.appendChild(dbg);
      }

      // Initially hide all target nodes so nothing flashes until detection
      for (let i = 0; i <= 6; i++) {
        const node = document.getElementById(`arTargetNode${i}`);
        if (node && node.object3D) node.object3D.visible = false;

        // hook into MindAR target events — targetFound/targetLost fire on the a-entity
        if (node) {
          node.addEventListener("targetFound", (evt) => {
            console.log('[AR] event targetFound', i, evt);
            // when the image target is found, activate the corresponding organ view
            // force visible true here to ensure A-Frame displays it
            if (node.object3D) node.object3D.visible = true;
            activateOrgan(i);
          });
          node.addEventListener("targetLost", (evt) => {
            console.log('[AR] event targetLost', i, evt);
            // when lost, hide the overlay and the mesh
            // but only clear if the lost target matches the active one
            if (AppState.activeKey === TARGET_MAP[i]) {
              // small delay so flicker doesn't hide immediately if reacquired quickly
              setTimeout(() => {
                // hide the node explicitly
                if (node && node.object3D) node.object3D.visible = false;
                // if not reacquired, clear UI
                if (AppState.activeKey === TARGET_MAP[i]) deactivateAllNodes();
              }, 300);
            } else {
              // ensure node hidden when lost
              if (node && node.object3D) node.object3D.visible = false;
            }
          });
        }
      }

      // Listen to scene-level MindAR events (optional) to debug
      const sceneEl = document.querySelector('a-scene');
      if (sceneEl) {
        sceneEl.addEventListener('arReady', () => console.log('AR system ready'));
        sceneEl.addEventListener('cameraPermissionRequested', () => console.log('camera permission requested'));
        sceneEl.addEventListener('cameraPermissionGranted', () => console.log('camera permission granted'));
        sceneEl.addEventListener('cameraPermissionDenied', () => console.log('camera permission denied'));
      }

      // Helpful tip: print system state if available
      try {
        const sys = sceneEl.systems && sceneEl.systems['mindar-image-system'];
        if (sys) {
          console.log('[AR] mindar-image-system available', sys);
        } else {
          console.warn('[AR] mindar-image-system not available on scene.systems');
        }
      } catch (e) {
        console.warn('[AR] sys check failed', e);
      }
    });
  </script>
</head>
<body>

  <div id="welcomeGate">
    <div class="welcome-card">
      <div class="scholar-meta">
        <span class="scholar-name">OrganoAR Education Suite</span>
        <span class="scholar-title">Substance Pathology Visualizer</span>
      </div>
      <p class="welcome-desc">Scan the target card. The system will detect the organ and show a 3D view automatically.</p>
      <button class="btn-start" onclick="startApp()" aria-label="Start AR Camera">Start AR Camera</button>
    </div>
  </div>

  <div id="ar-ui-container">
    <header class="ar-top-bar">
      <div class="ar-top-row">
        <div class="organ-badge">
          <span id="organ-icon">🔬</span>
          <span id="active-organ-title">—</span>
          <span id="active-health-chip" class="chip green">100% HEALTH</span>
        </div>
      </div>
      <!-- manual selector removed: targets are chosen by image-tracking automatically -->
    </header>

    <div id="bottom-sheet" class="bottom-sheet collapsed">
      <div class="sheet-handle-bar" onclick="toggleSheet()">
        <div class="drag-indicator"></div>
        <div class="summary-line">
          <span id="exposure-line">1 Year Exposure</span>
          <span>▲ Expand</span>
        </div>
      </div>
      <div class="sheet-content">
        <div class="control-group">
          <div class="chip-group">
            <button class="chip-toggle active">🍺 Alcohol</button>
            <button class="chip-toggle">💊 Narcotics</button>
            <button class="chip-toggle">🚬 Smoking</button>
          </div>
        </div>
        <input type="range" min="1" max="20" value="1" aria-label="Exposure years">
        <div class="symptom-card">
          <ul id="symptom-list">
            <li>Episodic resting heart rate elevation</li>
            <li>Transient blood pressure spikes</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <a-scene 
    mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/examples/image-tracking/assets/card-example/card.mind; autoStart: false; uiScanning: yes;" 
    embedded 
    renderer="colorManagement: true; alpha: true; transparent: true;" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-light type="ambient" intensity="1.5"></a-light>
    <a-light type="directional" position="1 2 3" intensity="2.0"></a-light>

    <!-- Target Node 0: Brain -->
    <a-entity mindar-image-target="targetIndex: 0" id="arTargetNode0">
      <a-sphere radius="0.3" color="#38bdf8"></a-sphere>
    </a-entity>
    <a-entity mindar-image-target="targetIndex: 1" id="arTargetNode1">
      <a-sphere radius="0.3" color="#facc15"></a-sphere>
    </a-entity>
    <a-entity mindar-image-target="targetIndex: 2" id="arTargetNode2">
      <a-sphere radius="0.3" color="#4ade80"></a-sphere>
    </a-entity>
    
    <!-- Heart Node Target Index 3 -->
    <a-entity mindar-image-target="targetIndex: 3" id="arTargetNode3">
      <!-- 3D Heart Geometry Fallback Mesh -->
      <a-entity id="heart3DMesh" position="0 0 0" rotation="0 0 0">
        <a-octahedron radius="0.35" color="#ef4444" animation="property: scale; to: 1.1 1.1 1.1; dir: alternate; dur: 800; loop: true"></a-octahedron>
        <a-cylinder radius="0.08" height="0.4" color="#cbd5e1" position="0 0.25 0"></a-cylinder>
      </a-entity>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 4" id="arTargetNode4">
      <a-sphere radius="0.3" color="#fb923c"></a-sphere>
    </a-entity>
    <a-entity mindar-image-target="targetIndex: 5" id="arTargetNode5">
      <a-sphere radius="0.3" color="#a855f7"></a-sphere>
    </a-entity>
    <a-entity mindar-image-target="targetIndex: 6" id="arTargetNode6">
      <a-sphere radius="0.3" color="#ec4899"></a-sphere>
    </a-entity>
  </a-scene>

  <script>
    // Defensive: if MindAR is not available, ensure app doesn't crash
    document.addEventListener("DOMContentLoaded", () => {
      // Ensure nodes start hidden so they only appear when the system tells us they're found
      for (let i = 0; i <= 6; i++) {
        const node = document.getElementById(`arTargetNode${i}`);
        if (node && node.object3D) node.object3D.visible = false;
      }

      // If the MindAR system fails to attach events, log to help debugging
      const scene = document.querySelector('a-scene');
      if (!scene) console.warn('A-Frame scene missing');
    });
  </script>
</body>
</html>
